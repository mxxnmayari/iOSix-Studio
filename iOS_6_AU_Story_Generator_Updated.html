    try {
      const app = initializeApp(firebaseConfig);

      const auth = getAuth(app);

      window.firebaseAuth = auth;
      window.firebaseDb = db;
      window.GoogleAuthProvider = GoogleAuthProvider;
      window.signInWithPopup = signInWithPopup;
      window.signOut = signOut;

      async function initAuth() {
        try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);

            await signInAnonymously(auth);

                                  selectedTweet: {...twitter.selectedTweet, authorName: e.target.value}
                                })}
                                className="w-full bg-white dark:bg-purple-900 border rounded p-1 font-bold"
                              />
                            </div>
                            <div>
                              <label className="text-[10px] text-slate-500 block">Author Handle (@)</label>
                              <input 
                                type="text" 
                                value={twitter.selectedTweet.handle}
                                onChange={e => setTwitter({
                                  ...twitter, 
                                  selectedTweet: {...twitter.selectedTweet, handle: e.target.value}
                                })}
                                className="w-full bg-white dark:bg-purple-900 border rounded p-1"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="text-[10px] text-slate-500 block">Tweet Body Text</label>
                            <textarea 
                              rows="3"
                              value={twitter.selectedTweet.text}
                              onChange={e => setTwitter({
                                ...twitter, 
                                selectedTweet: {...twitter.selectedTweet, text: e.target.value}
                              })}
                              className="w-full bg-white dark:bg-purple-900 border rounded p-1 text-xs"
                            />
                          </div>
                        </div>
                      )}

                    </div>
                  )}

                  {/* 7. CONTACTS EDITOR */}
                  {activeTab === 'contacts' && (
                    <div className="space-y-3 bg-white/50 dark:bg-purple-950/40 p-3 rounded-xl border border-purple-200/50 dark:border-purple-800/30 text-xs">
                      <h3 className="font-bold text-teal-800 dark:text-teal-400 uppercase tracking-wider">Contacts Customizer</h3>
                      <button onClick={()=>setContactsList([...contactsList,{id:Date.now(),name:`Contact ${contactsList.length+1}`,phone:'',avatar:DEFAULT_AVATAR_USER1,favorite:false}])} className="bg-teal-600 text-white px-2 py-1 rounded text-[10px] font-bold">+ Add Contact</button>
                      <div className="font-bold text-[10px]">Favorites: {contactsList.filter(c=>c.favorite).length}</div>
                      <div className="space-y-2">
                        {contactsList.map((c, idx) => (
                          <div key={c.id} className="bg-white/80 dark:bg-purple-900/60 p-2 rounded border space-y-1">
                            <input 
                              type="text" 
                              value={c.name}
                              onChange={e => {
                                const up = [...contactsList];
                                up[idx].name = e.target.value;
                                setContactsList(up);
                              }}
                              className="w-full bg-white dark:bg-purple-950 border rounded p-1 font-bold text-xs"
                            />
                            <input 
                              type="text" 
                              value={c.phone}
                              onChange={e => {
                                const up = [...contactsList];
                                up[idx].phone = e.target.value;
                                setContactsList(up);
                              }}
                              className="w-full bg-white dark:bg-purple-950 border rounded p-1 text-xs"
                            />
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                </div>
              </div>
            )}

          </div>

          {/* DISCORD FEEDBACK MODAL */}
          {feedbackModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="purple-glass rounded-3xl max-w-md w-full p-6 space-y-4 border border-lilac-300 shadow-2xl text-slate-800 dark:text-white">
                <div className="flex items-center justify-between border-b border-purple-200 dark:border-purple-800 pb-3">
                  <h3 className="font-extrabold text-lg text-purple-900 dark:text-lilac-200">Feedback & Community</h3>
                  <button onClick={() => setFeedbackModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg"><i className="fa-solid fa-xmark"></i></button>
                </div>
                <p className="text-xs leading-relaxed text-slate-600 dark:text-lilac-200">
                  Join our Discord server to request new features, report bugs, or share your AU story mockups with other creators!
                </p>
                <div className="pt-2">
                  <a 
                    href="https://discord.gg/your-community-link" 
                    target="_blank" 
                    rel="noreferrer"
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg transition"
                  >
                    <i className="fa-brands fa-discord text-base"></i>
                    <span>Join Discord Community</span>
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* CHARACTER VAULT MODAL */}
          {characterModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="purple-glass rounded-3xl max-w-lg w-full p-6 space-y-4 border border-lilac-300 shadow-2xl text-slate-800 dark:text-white max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-purple-200 dark:border-purple-800 pb-3 flex-shrink-0">
                  <div>
                    <h3 className="font-extrabold text-lg text-purple-900 dark:text-lilac-200">Character Vault</h3>
                    <p className="text-[11px] text-slate-500">Store character handles & avatars across templates</p>
                  </div>
                  <button 
                    onClick={() => {
                      const newChar = {
                        id: Date.now().toString(),
                        contactName: `User ${characters.length + 1}`,
                        igUsername: `user${characters.length + 1}`,
                        igDisplayName: `Username ${characters.length + 1}`,
                        twUsername: `username${characters.length + 1}`,
                        twDisplayName: `Username ${characters.length + 1}`,
                        fbName: `User ${characters.length + 1}`,
                        avatar: characters.length % 2 === 0 ? DEFAULT_AVATAR_USER1 : DEFAULT_AVATAR_USER2,
                        bio: 'Character bio'
                      };
                      setCharacters([...characters, newChar]);
                    }}
                    className="bg-purple-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs shadow hover:bg-purple-700 flex items-center gap-1"
                  >
                    <i className="fa-solid fa-plus"></i> Add
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                  {characters.map((char, idx) => (
                    <div key={char.id} className="bg-white/80 dark:bg-purple-900/60 p-3 rounded-2xl border border-purple-200 dark:border-purple-800 space-y-2">
                      <div className="flex items-center gap-3">
                        <img src={char.avatar} className="w-12 h-12 rounded-full object-cover border-2 border-purple-300 shadow flex-shrink-0" />
                        <div className="flex-1 grid grid-cols-2 gap-2">
                          <div>
                            <label className="text-[9px] font-bold text-slate-500 block">Contact Name</label>
                            <input 
                              type="text" 
                              value={char.contactName}
                              onChange={e => {
                                const up = [...characters];
                                up[idx].contactName = e.target.value;
                                setCharacters(up);
                              }}
                              className="w-full bg-white dark:bg-purple-950 border rounded-lg p-1 text-xs font-bold"
                            />
                          </div>
                          <div>
                            <label className="text-[9px] font-bold text-slate-500 block">IG Username (@)</label>
                            <input 
                              type="text" 
                              value={char.igUsername || ''}
                              onChange={e => {
                                const up = [...characters];
                                up[idx].igUsername = e.target.value;
                                setCharacters(up);
                              }}
                              className="w-full bg-white dark:bg-purple-950 border rounded-lg p-1 text-xs font-medium"
                            />
                          </div>
                          <div>
                            <label className="text-[9px] font-bold text-slate-500 block">Twitter Username (@)</label>
                            <input 
                              type="text" 
                              value={char.twUsername || ''}
                              onChange={e => {
                                const up = [...characters];
                                up[idx].twUsername = e.target.value;
                                setCharacters(up);
                              }}
                              className="w-full bg-white dark:bg-purple-950 border rounded-lg p-1 text-xs font-bold"
                            />
                          </div>
                          <div>
                            <label className="text-[9px] font-bold text-slate-500 block">Twitter Display Name</label>
                            <input 
                              type="text" 
                              value={char.twDisplayName || ''}
                              onChange={e => {
                                const up = [...characters];
                                up[idx].twDisplayName = e.target.value;
                                setCharacters(up);
                              }}
                              className="w-full bg-white dark:bg-purple-950 border rounded-lg p-1 text-xs font-bold"
                            />
                          </div>
                          <div><label className="text-[9px] font-bold text-slate-500 block">Instagram Display Name</label><input type="text" value={char.igDisplayName || ''} onChange={e=>{const up=[...characters];up[idx].igDisplayName=e.target.value;setCharacters(up);}} className="w-full bg-white dark:bg-purple-950 border rounded-lg p-1 text-xs"/></div>
                          <div><label className="text-[9px] font-bold text-slate-500 block">Facebook Username</label><input type="text" value={char.fbUsername || ''} onChange={e=>{const up=[...characters];up[idx].fbUsername=e.target.value;setCharacters(up);}} className="w-full bg-white dark:bg-purple-950 border rounded-lg p-1 text-xs"/></div>
                          <div><label className="text-[9px] font-bold text-slate-500 block">Facebook Display Name</label><input type="text" value={char.fbDisplayName || char.fbName || ''} onChange={e=>{const up=[...characters];up[idx].fbDisplayName=e.target.value;up[idx].fbName=e.target.value;setCharacters(up);}} className="w-full bg-white dark:bg-purple-950 border rounded-lg p-1 text-xs"/></div>
                        </div>
                        <label className="flex items-center gap-1 text-[10px] font-semibold"><input type="checkbox" checked={!!char.sameUsername} onChange={e=>{const up=[...characters];up[idx].sameUsername=e.target.checked;if(e.target.checked){up[idx].twUsername=up[idx].igUsername;up[idx].twDisplayName=up[idx].igDisplayName;}setCharacters(up);}}/> Instagram and Twitter use the same username/name</label>
                        <div className="grid grid-cols-2 gap-2 text-[10px]">
                          <label className="flex items-center gap-1"><input type="checkbox" checked={!!char.igVerified} onChange={e=>{const up=[...characters];up[idx].igVerified=e.target.checked;setCharacters(up);}}/> Instagram Verified</label>
                          <label className="flex items-center gap-1"><input type="checkbox" checked={!!char.igPrivate} onChange={e=>{const up=[...characters];up[idx].igPrivate=e.target.checked;setCharacters(up);}}/> Instagram Private</label>
                          <label className="flex items-center gap-1"><input type="checkbox" checked={!!char.fbVerified} onChange={e=>{const up=[...characters];up[idx].fbVerified=e.target.checked;setCharacters(up);}}/> Facebook Verified</label>
                          <label className="flex items-center gap-1"><input type="checkbox" checked={!!char.fbPrivate} onChange={e=>{const up=[...characters];up[idx].fbPrivate=e.target.checked;setCharacters(up);}}/> Facebook Private</label>
                          <label className="flex items-center gap-1"><input type="checkbox" checked={!!char.twVerified} onChange={e=>{const up=[...characters];up[idx].twVerified=e.target.checked;setCharacters(up);}}/> Twitter Verified</label>
                          <label className="flex items-center gap-1"><input type="checkbox" checked={!!char.twPrivate} onChange={e=>{const up=[...characters];up[idx].twPrivate=e.target.checked;setCharacters(up);}}/> Twitter Private</label>
                        </div>
                        <label className="block text-[9px]">Profile Cover Photo<input type="file" accept="image/*" className="block w-full text-[9px]" onChange={e=>handleImageUpload(e,url=>{const up=[...characters];up[idx].coverPhoto=url;setCharacters(up);})}/></label>
                      </div>

                      <div className="flex items-center justify-between pt-1 border-t border-purple-100 dark:border-purple-800/60 text-[10px]">
                        <button 
                          onClick={() => applyCharacterToMockup(char)}
                          className="bg-gradient-to-r from-lilac-600 to-purple-600 text-white font-bold px-2.5 py-1 rounded-lg flex items-center gap-1 shadow-sm hover:opacity-90"
                        >
                          <i className="fa-solid fa-wand-magic-sparkles text-[9px]"></i> Apply to Active App
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="pt-2 border-t border-purple-200 dark:border-purple-800 flex-shrink-0">
                  <button 
                    onClick={() => setCharacterModalOpen(false)} 
                    className="w-full bg-purple-600 text-white font-bold py-2 rounded-xl text-xs shadow"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SCREENSHOT & EXPORT MODAL */}
          {exportModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="purple-glass rounded-3xl max-w-md w-full p-6 space-y-4 border border-lilac-300 shadow-2xl text-slate-800 dark:text-white">
                <div className="flex items-center justify-between border-b border-purple-200 dark:border-purple-800 pb-3">
                  <h3 className="font-extrabold text-lg text-purple-900 dark:text-lilac-200">Save Mockup Photo</h3>
                  <button onClick={handleCloseExportModal} className="text-slate-400 hover:text-slate-600 text-lg"><i className="fa-solid fa-xmark"></i></button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="flex items-center justify-between">
                    <span className="font-semibold">Include Phone Bezel Frame</span>
                    <input 
                      type="checkbox" 
                      checked={exportIncludeFrame} 
                      onChange={e => setExportIncludeFrame(e.target.checked)}
                      className="w-4 h-4 accent-purple-600"
                    />
                  </div>
                  
                  <div className="flex items-center justify-between">
                    <span className="font-semibold">Resolution Scale</span>
                    <select 
                      value={exportResolution}
                      onChange={e => setExportResolution(Number(e.target.value))}
                      className="bg-white dark:bg-purple-900 border rounded px-2 py-1 font-semibold"
                    >
                      <option value={1}>1x Standard</option>
                      <option value={2}>2x HD Resolution</option>
                      <option value={3}>3x Ultra HD Scale</option>
                    </select>
                  </div>

                  <button 
                    onClick={captureScreenshot}
                    className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-xl text-xs transition shadow"
                  >
                    Refresh Preview
                  </button>
                </div>

                <div className="bg-black/30 rounded-xl p-2 text-center min-h-[150px] flex items-center justify-center border border-purple-300/30">
                  {exporting ? (
                    <div className="space-y-2 text-purple-300">
                      <i className="fa-solid fa-spinner fa-spin text-2xl"></i>
                      <p className="text-xs">Generating PNG image...</p>
                    </div>
                  ) : renderedExportUrl ? (
                    <img src={renderedExportUrl} className="max-h-52 mx-auto rounded shadow-lg object-contain" />
                  ) : (
                    <p className="text-slate-400">Click Refresh Preview to generate</p>
                  )}
                </div>

                <a
                  href={renderedExportUrl || '#'}
                  download={`ios6-au-${activeTab}-${Date.now()}.png`}
                  className={`w-full py-2.5 rounded-xl font-bold text-xs text-center transition flex items-center justify-center gap-2 ${
                    renderedExportUrl ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-400 text-white pointer-events-none'
                  }`}
                >
                  <i className="fa-solid fa-download"></i>
                  Download PNG Image
                </a>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
