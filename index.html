  <style>
    :root {
      --lav: #c6b4e5;
      --lilac: #b49bdc;
      --yellow: #f7f78e;
      --ivory: #fffed1;
      --sky: #a8cfe2;
      --blue: #789fc8;
      --ink: #39215e;
      --paper: #fffdf7;
      --line: #d8cde8;
      --muted: #756a84;
      --shadow: 0 14px 40px #4a2c6714;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #fbf9ff;
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background:
        radial-gradient(ellipse at 18% 18%, #fff9f4 0%, transparent 34%),
        radial-gradient(ellipse at 82% 24%, #d9efff 0%, transparent 34%),
        radial-gradient(ellipse at 78% 82%, #fff7a8 0%, transparent 32%),
        radial-gradient(ellipse at 20% 84%, #e3d4ff 0%, transparent 38%),
        linear-gradient(135deg, #cbb8ec 0%, #bca6e4 24%, #fff5a0 49%, #fffbd8 64%, #b8dced 82%, #8eb4dc 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      transition: opacity .55s ease, visibility .55s ease;
    }

    .intro-panel {
      width: min(520px, 100%);
      background: rgba(255, 253, 249, 0.94);
      border: 1px solid #ffffffa8;
      box-shadow: 0 18px 60px #39215e20;
      backdrop-filter: blur(12px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      text-align: center;
    }

    .enter-btn, .primary-btn {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
      padding: 12px 24px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      transition: transform .2s, background .2s, box-shadow .2s;
    }
    .enter-btn:hover, .primary-btn:hover {
      background: #54377a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(57,33,94,0.25);
    }

    .top-strip {
      background: var(--ink);
      color: #fff8dc;
      padding: 8px 14px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 700;
    }

    header {
      background: #fffdf8;
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 5;
    }

    .header-inner {
      max-width: 1280px;
      margin: auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .nav-btn:hover { background: #f0e8fb; }

    main {
      max-width: 1280px;
      margin: auto;
      padding: 0 24px 70px;
    }

    .hero {
      margin: 24px 0;
      background: var(--ivory);
      min-height: 180px;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #ece7b7;
      border-radius: 16px;
    }
    .hero:before, .hero:after {
      content: "✿";
      position: absolute;
      font-size: 42px;
      color: #f1a7bd;
      opacity: .9;
    }
    .hero:before { left: 5%; top: 12%; }
    .hero:after { right: 5%; bottom: 12%; color: #9fc5e4; }

    .hero h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(24px, 3.5vw, 40px);
      font-weight: 400;
      line-height: 1.1;
      margin: 8px 0;
      color: var(--ink);
    }

    .hero p {
      max-width: 640px;
      margin: 0 auto;
      color: #675b73;
      font-family: Georgia, serif;
      font-size: 13px;
      line-height: 1.5;
    }

    .secondary-btn {
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      padding: 10px 18px;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 8px;
      transition: background .2s, transform .2s;
    }
    .secondary-btn:hover { background: #f0e8fb; transform: translateY(-1px); }

    .workspace {
      margin-top: 24px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
      border-radius: 16px;
      overflow: hidden;
    }

    .workspace-top {
      padding: 16px 24px;
      background: #f4eefc;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .workspace-body {
      display: grid;
      grid-template-columns: minmax(360px, 480px) minmax(0, 1fr);
      min-height: 650px;
    }
    @media (max-width: 980px) { .workspace-body { grid-template-columns: 1fr; } }

    .controls {
      padding: 24px;
      border-right: 1px solid var(--line);
      background: #fffdf9;
      max-height: 820px;
      overflow-y: auto;
    }

    .preview-area {
      background: #f4f1f8;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      min-width: 0;
      overflow-x: auto;
    }

    .bg-ios-grid-light {
      background-color: #dbdfe7;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
      background-size: 8px 8px;
    }

    .ios6-nav-bar {
      background: linear-gradient(to bottom, #b0c4de 0%, #6d8ba6 50%, #51708f 51%, #315171 100%);
      border-bottom: 1px solid #1f364d;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.3);
      text-shadow: 0 -1px 0 rgba(0,0,0,0.7);
    }

    .ios6-nav-button {
      background: linear-gradient(to bottom, #7a98b3 0%, #466785 50%, #305170 51%, #223f5b 100%);
      border: 1px solid #1d334a;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 1px 2px rgba(0,0,0,0.3);
      text-shadow: 0 -1px 0 rgba(0,0,0,0.8);
      color: white;
    }

    /* 2012 Instagram Nav Bar Gradient */
    .ig-nav-bar-2012 {
      background: linear-gradient(to bottom, #4c688d 0%, #314a6e 50%, #283e5c 100%);
      border-bottom: 1px solid #1a2a40;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 4px rgba(0,0,0,0.3);
      text-shadow: 0 -1px 0 rgba(0,0,0,0.8);
    }

    /* 2012 Twitter Nav Bar & Button Styles */
    .tw-nav-bar-2012 {
      background: linear-gradient(to bottom, #3b7bb2 0%, #20598b 50%, #174872 51%, #0f3556 100%);
      border-bottom: 1px solid #0d2e4a;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 4px rgba(0,0,0,0.3);
      text-shadow: 0 -1px 0 rgba(0,0,0,0.8);
      color: white;
    }

    .tw-btn-2012-blue {
      background: linear-gradient(to bottom, #5394c9 0%, #29689b 50%, #1e527d 51%, #123d60 100%);
      border: 1px solid #0f314f;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 1px 2px rgba(0,0,0,0.25);
      color: white;
      font-weight: 700;
      text-shadow: 0 -1px 0 rgba(0,0,0,0.6);
    }

    .tw-btn-2012-red {
      background: linear-gradient(to bottom, #e74c3c 0%, #c0392b 50%, #a93226 51%, #922b21 100%);
      border: 1px solid #7b241c;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 1px 2px rgba(0,0,0,0.25);
      color: white;
      font-weight: 700;
      text-shadow: 0 -1px 0 rgba(0,0,0,0.6);
    }

    .tw-btn-2012-glossy {
      background: linear-gradient(to bottom, #ffffff 0%, #f0f0f0 50%, #e1e1e1 51%, #d6d6d6 100%);
      border: 1px solid #a8a8a8;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.12);
      color: #222222;
      font-weight: 700;
    }

    .tw-bottom-bar-2012 {
      background: linear-gradient(to bottom, #333333 0%, #1f1f1f 50%, #141414 51%, #0a0a0a 100%);
      border-top: 1px solid #0a0a0a;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }

    /* 2012 Facebook Header Bar */
    .fb-nav-bar-2012 {
      background: linear-gradient(to bottom, #4c66a4 0%, #3b5998 50%, #2b437c 100%);
      border-bottom: 1px solid #1e2e54;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .fb-btn-glossy {
      background: linear-gradient(to bottom, #ffffff 0%, #f0f0f0 50%, #e1e1e1 51%, #d6d6d6 100%);
      border: 1px solid #a8a8a8;
      border-radius: 3px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.15);
      color: #333333;
      font-weight: 700;
    }

    .fb-btn-blue {
      background: linear-gradient(to bottom, #5d7bbd 0%, #3b5998 50%, #2b437c 100%);
      border: 1px solid #1e2e54;
      border-radius: 3px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 1px 2px rgba(0,0,0,0.2);
      color: white;
      font-weight: 700;
    }

    /* 2012 Glossy Profile Edit Button */
    .ig-btn-2012-glossy {
      background: linear-gradient(to bottom, #ffffff 0%, #f0f0f0 50%, #e1e1e1 51%, #d6d6d6 100%);
      border: 1px solid #b5b5b5;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.1);
      color: #333333;
      font-weight: 700;
    }

    /* 2012 Glossy Blue Follow Button */
    .ig-btn-2012-blue {
      background: linear-gradient(to bottom, #5da2fa 0%, #347ee6 50%, #1e62c9 51%, #1251b3 100%);
      border: 1px solid #0f4094;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 1px 2px rgba(0,0,0,0.2);
      color: white;
      font-weight: 700;
      text-shadow: 0 -1px 0 rgba(0,0,0,0.5);
    }

    /* 2012 Glossy Red Blocked Button */
    .ig-btn-2012-red {
      background: linear-gradient(to bottom, #e74c3c 0%, #c0392b 50%, #a93226 51%, #922b21 100%);
      border: 1px solid #7b241c;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 1px 2px rgba(0,0,0,0.2);
      color: white;
      font-weight: 700;
      text-shadow: 0 -1px 0 rgba(0,0,0,0.5);
    }

    /* 2012 Glossy Grey Requested/Following Button */
    .ig-btn-2012-grey {
      background: linear-gradient(to bottom, #e0e0e0 0%, #cccccc 50%, #b8b8b8 51%, #a8a8a8 100%);
      border: 1px solid #777777;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 1px 2px rgba(0,0,0,0.15);
      color: #222222;
      font-weight: 700;
      text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    }

    /* 2012 Glossy Tab Subbar */
    .ig-subbar-2012 {
      background: linear-gradient(to bottom, #f9f9f9 0%, #e6e6e6 100%);
      border-bottom: 1px solid #c8c8c8;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .ig-tab-arrow-down {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #e6e6e6;
    }

    .ig-bottom-bar-2012 {
      background: linear-gradient(to bottom, #2d2d2d 0%, #1a1a1a 50%, #0d0d0d 51%, #000000 100%);
      border-top: 1px solid #333333;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .imessage-bubble-blue {
      background: linear-gradient(to bottom, #5da2fa 0%, #1260e6 100%);
      border: 1px solid #0f52cc;
      color: white;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 1px 2px rgba(0,0,0,0.25);
      border-radius: 18px;
      position: relative;
    }

    .imessage-bubble-green {
      background: linear-gradient(to bottom, #94ed5a 0%, #30bd0a 100%);
      border: 1px solid #239403;
      color: #0d3801;
      font-weight: 500;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 1px 2px rgba(0,0,0,0.25);
      border-radius: 18px;
      position: relative;
    }

    .imessage-bubble-grey {
      background: linear-gradient(to bottom, #ffffff 0%, #e2e4e8 100%);
      border: 1px solid #b3b6ba;
      color: #111;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 1px 2px rgba(0,0,0,0.18);
      border-radius: 18px;
      position: relative;
    }

    @keyframes shimmer {
      0% { background-position: -150px 0; }
      100% { background-position: 150px 0; }
    }

    .slide-to-unlock-text {
      background: linear-gradient(90deg, #4d4d4d 0%, #4d4d4d 20%, #ffffff 50%, #4d4d4d 80%, #4d4d4d 100%);
      background-size: 200px 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2.5s infinite linear;
    }

    /* Pill Toggle Switcher */
    .pill-toggle-container {
      display: inline-flex;
      align-items: center;
      background: rgba(243, 237, 247, 0.85);
      border: 1px solid #e2d7ec;
      border-radius: 9999px;
      padding: 3px;
      gap: 2px;
    }
    .pill-toggle-btn {
      padding: 5px 16px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 9999px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: #39215e;
      border: none;
      background: transparent;
    }
    .pill-toggle-btn.active {
      background: #e4a5bf;
      color: #2e1742;
      box-shadow: 0 2px 8px rgba(228, 165, 191, 0.45);
    }
  </style>
</head>

                  </div>

                  <div className="p-2 bg-white border rounded-lg space-y-1.5">
                    <label className="text-[10px] font-bold text-slate-600 block">Facebook Cover Photo</label>
                    <img src={vaultForm.fbCover || DEFAULT_COVER_PLACEHOLDER} className="w-full h-20 rounded object-cover border" />
                    <input type="file" accept="image/*" onChange={e => handleImageUpload(e, url => setVaultForm({...vaultForm, fbCover:url}))} className="w-full text-[9px]" />
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-[9px] font-bold text-slate-500 block">Facebook Bio</label>
                      <input type="text" value={vaultForm.fbBio} onChange={e => setVaultForm({...vaultForm, fbBio: e.target.value})} className="w-full bg-white border rounded p-1 text-[10px]" />
                    </div>
                    <div>
                      <label className="text-[9px] font-bold text-slate-500 block">Facebook Link</label>
                      <input type="text" value={vaultForm.fbWebsite} onChange={e => setVaultForm({...vaultForm, fbWebsite: e.target.value})} className="w-full bg-white border rounded p-1 text-[10px]" />
                    </div>
                    <div>
                      <label className="text-[9px] font-bold text-slate-500 block">Lives In</label>
                      <input type="text" value={vaultForm.fbLivesIn} onChange={e => setVaultForm({...vaultForm, fbLivesIn: e.target.value})} className="w-full bg-white border rounded p-1 text-[10px]" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[9px] font-bold text-slate-500 block">Working At</label>
                      <input type="text" value={vaultForm.fbWorkingAt} onChange={e => setVaultForm({...vaultForm, fbWorkingAt: e.target.value})} className="w-full bg-white border rounded p-1 text-[10px]" />
                    </div>
                    <div>
                      <label className="text-[9px] font-bold text-slate-500 block">Studied At</label>
                      <input type="text" value={vaultForm.fbStudiedAt} onChange={e => setVaultForm({...vaultForm, fbStudiedAt: e.target.value})} className="w-full bg-white border rounded p-1 text-[10px]" />
                    </div>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="primary-btn flex-1 py-2 text-xs">{vaultForm.id ? 'Save Changes' : 'Save Profile'}</button>
                    {vaultForm.id && <button type="button" onClick={resetVaultForm} className="secondary-btn py-2 text-xs">Cancel</button>}
                  </div>
                </form>

                <div className="space-y-2">
                  <span className="font-bold text-purple-900 block uppercase tracking-wider text-[10px]">Saved Profiles ({characters.length}):</span>
                  {characters.map(char => (
                    <div key={char.id} className="p-3 bg-white border rounded-xl flex items-center gap-3">
                      <img src={char.contactAvatar} className="w-10 h-10 rounded-full border object-cover" />
                      <div className="flex-1 min-w-0">
                        <strong className="font-serif text-sm block">{char.contactName}</strong>
                        <span className="text-[10px] text-slate-400 block">@{char.twUsername || char.igUsername || 'username'}</span>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => editVaultCharacter(char)} className="px-2.5 py-1 text-[10px] font-bold bg-slate-100 border rounded">Edit</button>
                        <button onClick={() => deleteVaultCharacter(char.id)} className="px-2.5 py-1 text-[10px] font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded">Delete</button>
                        <button onClick={() => autofillMockupsWithCharacter(char)} className="primary-btn py-1 px-2.5 text-[9px] bg-purple-700">Use for Mockups</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* EXPORT MODAL */}
          {exportOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#fffdf9] border border-purple-200 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl text-slate-800">
                <div className="flex justify-between items-center border-b pb-3">
                  <h2 className="font-serif text-xl font-bold text-purple-950">Export Mockup Photo</h2>
                  <button onClick={() => setExportOpen(false)} className="text-xl font-bold text-slate-400">×</button>
                </div>

                <div className="bg-black/10 rounded-xl p-2 text-center min-h-[160px] flex items-center justify-center border">
                  {exporting ? (
                    <div className="space-y-2 text-purple-900">
                      <i className="fa-solid fa-spinner fa-spin text-2xl"></i>
                      <p className="text-xs font-bold">Rendering PNG image...</p>
                    </div>
                  ) : renderedExportUrl ? (
                    <img src={renderedExportUrl} className="max-h-48 mx-auto rounded shadow-lg object-contain" />
                  ) : (
                    <p className="text-slate-400 text-xs">Click Refresh Render to generate</p>
                  )}
                </div>

                <a
                  href={renderedExportUrl || '#'}
                  download={`iosix-${activeTab}-${Date.now()}.png`}
                  className={`w-full py-2.5 rounded-xl font-bold text-xs text-center transition flex items-center justify-center gap-2 ${
                    renderedExportUrl ? 'bg-emerald-600 text-white shadow-md hover:bg-emerald-700' : 'bg-slate-300 text-white pointer-events-none'
                  }`}
                >
                  <i className="fa-solid fa-download"></i>
                  Download PNG
                </a>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
