<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOSix Studio — AU Story Generator (@by_mayarii)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html2canvas CDN for screenshot exporting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for inline JSX execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --lav: #c6b4e5;
      --lilac: #b49bdc;
      --yellow: #f7f78e;
      --ivory: #fffed1;
      --sky: #a8cfe2;
      --blue: #789fc8;
      --ink: #39215e;
      --paper: #fffdf7;
      --line: #d8cde8;
      --muted: #756a84;
      --shadow: 0 14px 40px #4a2c6714;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #fbf9ff;
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background:
        radial-gradient(ellipse at 18% 18%, #fff9f4 0%, transparent 34%),
        radial-gradient(ellipse at 82% 24%, #d9efff 0%, transparent 34%),
        radial-gradient(ellipse at 78% 82%, #fff7a8 0%, transparent 32%),
        radial-gradient(ellipse at 20% 84%, #e3d4ff 0%, transparent 38%),
        linear-gradient(135deg, #cbb8ec 0%, #bca6e4 24%, #fff5a0 49%, #fffbd8 64%, #b8dced 82%, #8eb4dc 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      transition: opacity .55s ease, visibility .55s ease;
    }

    .intro-panel {
      width: min(520px, 100%);
      background: rgba(255, 253, 249, 0.94);
      border: 1px solid #ffffffa8;
      box-shadow: 0 18px 60px #39215e20;
      backdrop-filter: blur(12px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      text-align: center;
    }

    .enter-btn, .primary-btn {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
      padding: 12px 24px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      transition: transform .2s, background .2s, box-shadow .2s;
    }
    .enter-btn:hover, .primary-btn:hover {
      background: #54377a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(57,33,94,0.25);
    }

    .top-strip {
      background: var(--ink);
      color: #fff8dc;
      padding: 8px 14px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 700;
    }

    header {
      background: #fffdf8;
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 5;
    }

    .header-inner {
      max-width: 1280px;
      margin: auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .nav-btn:hover { background: #f0e8fb; }

    main {
      max-width: 1280px;
      margin: auto;
      padding: 0 24px 70px;
    }

    .hero {
      margin: 24px 0;
      background: var(--ivory);
      min-height: 180px;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #ece7b7;
      border-radius: 16px;
    }
    .hero:before, .hero:after {
      content: "✿";
      position: absolute;
      font-size: 42px;
      color: #f1a7bd;
      opacity: .9;
    }
    .hero:before { left: 5%; top: 12%; }
    .hero:after { right: 5%; bottom: 12%; color: #9fc5e4; }

    .hero h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(24px, 3.5vw, 40px);
      font-weight: 400;
      line-height: 1.1;
      margin: 8px 0;
      color: var(--ink);
    }

    .hero p {
      max-width: 640px;
      margin: 0 auto;
      color: #675b73;
      font-family: Georgia, serif;
      font-size: 13px;
      line-height: 1.5;
    }

    .secondary-btn {
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      padding: 10px 18px;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 8px;
      transition: background .2s, transform .2s;
    }
    .secondary-btn:hover { background: #f0e8fb; transform: translateY(-1px); }

    .workspace {
      margin-top: 24px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
      border-radius: 16px;
      overflow: hidden;
    }

    .workspace-top {
      padding: 16px 24px;
      background: #f4eefc;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .workspace-body {
      display: grid;
      grid-template-columns: minmax(360px, 480px) minmax(0, 1fr);
      min-height: 650px;
    }
    @media (max-width: 980px) { .workspace-body { grid-template-columns: 1fr; } }

    .controls {
      padding: 24px;
      border-right: 1px solid var(--line);
      background: #fffdf9;
      max-height: 820px;
      overflow-y: auto;
    }

    .preview-area {
      background: #f4f1f8;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      min-width: 0;
      overflow-x: auto;
    }

    .bg-ios-grid-light {
      background-color: #dbdfe7;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
      background-size: 8px 8px;
    }
    .bg-ios-grid-dark {
      background-color: #1a1a1a;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 8px 8px;
    }

    /* iOS 6 Classic iMessage Bubbles */
    .bubble-classic {
      position: relative;
      padding: 8px 14px;
      border-radius: 16px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), 0 1px 2px rgba(0,0,0,0.15);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      max-width: 75%;
    }
    .bubble-me-blue {
      background: linear-gradient(to bottom, #4ea3f8 0%, #157df4 100%);
      border: 1px solid #0f62c7;
      color: white;
      text-shadow: 0 -1px 0 rgba(0,0,0,0.2);
      border-bottom-right-radius: 4px;
    }
    .bubble-me-blue::after {
      content: ''; position: absolute; right: -5px; bottom: 0;
      width: 12px; height: 16px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 16"><path d="M0,16 C6,16 12,12 12,0 C12,12 6,15 0,15 Z" fill="%23157df4"/></svg>') no-repeat bottom right;
    }
    .bubble-me-green {
      background: linear-gradient(to bottom, #7ce65e 0%, #3bc11b 100%);
      border: 1px solid #2a9412;
      color: white;
      text-shadow: 0 -1px 0 rgba(0,0,0,0.2);
      border-bottom-right-radius: 4px;
    }
    .bubble-me-green::after {
      content: ''; position: absolute; right: -5px; bottom: 0;
      width: 12px; height: 16px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 16"><path d="M0,16 C6,16 12,12 12,0 C12,12 6,15 0,15 Z" fill="%233bc11b"/></svg>') no-repeat bottom right;
    }
    .bubble-them {
      background: linear-gradient(to bottom, #f3f3f5 0%, #d8d8de 100%);
      border: 1px solid #b6b6bc;
      color: black;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
      border-bottom-left-radius: 4px;
    }
    .bubble-them::after {
      content: ''; position: absolute; left: -5px; bottom: 0;
      width: 12px; height: 16px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 16"><path d="M12,16 C6,16 0,12 0,0 C0,12 6,15 12,15 Z" fill="%23d8d8de"/></svg>') no-repeat bottom left;
    }

    .ios6-nav-bar {
      background: linear-gradient(to bottom, #b0c4de 0%, #6d8ba6 50%, #51708f 51%, #315171 100%);
      border-bottom: 1px solid #1f364d;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.3);
      text-shadow: 0 -1px 0 rgba(0,0,0,0.7);
    }
    .ios6-nav-button {
      background: linear-gradient(to bottom, #7a98b3 0%, #466785 50%, #305170 51%, #223f5b 100%);
      border: 1px solid #1d334a;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 1px 2px rgba(0,0,0,0.3);
      text-shadow: 0 -1px 0 rgba(0,0,0,0.8);
      color: white;
    }

    /* Notes App Classic UI */
    .notes-leather-header {
      background: linear-gradient(to bottom, #755543 0%, #583c2c 50%, #462c1e 51%, #362014 100%);
      border-bottom: 2px solid #231209;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 2px 4px rgba(0,0,0,0.4);
      color: white;
      text-shadow: 0 -1px 0 rgba(0,0,0,0.8);
    }
    .notes-btn {
      background: linear-gradient(to bottom, #8a6550 0%, #5c3f2f 50%, #472d20 51%, #372115 100%);
      border: 1px solid #231209;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 1px 1px rgba(0,0,0,0.3);
      color: white;
    }
    .notes-paper-bg {
      background-color: #fdf5b1;
      background-image: repeating-linear-gradient(transparent, transparent 31px, #e4c278 31px, #e4c278 32px);
      background-attachment: local;
      color: #3b2c15;
    }
    .notes-paper-bg-dark {
      background-color: #2c2c2c;
      background-image: repeating-linear-gradient(transparent, transparent 31px, #444 31px, #444 32px);
      background-attachment: local;
      color: #e0e0e0;
    }
    .notes-list-item { border-bottom: 1px solid #e4c278; }
    .notes-list-item-dark { border-bottom: 1px solid #444; }

    /* INSTAGRAM 2012 CSS */
    .ig-nav-bar-2012 {
      background: linear-gradient(to bottom, #4c688d 0%, #314a6e 50%, #283e5c 100%);
      border-bottom: 1px solid #1a2a40;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 4px rgba(0,0,0,0.3);
      text-shadow: 0 -1px 0 rgba(0,0,0,0.8);
    }
    .ig-btn-2012-glossy {
      background: linear-gradient(to bottom, #ffffff 0%, #f0f0f0 50%, #e1e1e1 51%, #d6d6d6 100%);
      border: 1px solid #b5b5b5;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.1);
      color: #333333;
      font-weight: 700;
    }
    .ig-btn-2012-blue {
      background: linear-gradient(to bottom, #5da2fa 0%, #347ee6 50%, #1e62c9 51%, #1251b3 100%);
      border: 1px solid #0f4094;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 1px 2px rgba(0,0,0,0.2);
      color: white;
      font-weight: 700;
      text-shadow: 0 -1px 0 rgba(0,0,0,0.5);
    }
    .ig-btn-2012-grey {
      background: linear-gradient(to bottom, #e0e0e0 0%, #cccccc 50%, #b8b8b8 51%, #a8a8a8 100%);
      border: 1px solid #777777;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 1px 2px rgba(0,0,0,0.15);
      color: #222222;
      font-weight: 700;
      text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    }
    .ig-subbar-2012 {
      background: linear-gradient(to bottom, #f9f9f9 0%, #e6e6e6 100%);
      border-bottom: 1px solid #c8c8c8;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .ig-tab-arrow-down {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #e6e6e6;
    }
    .ig-bottom-bar-2012 {
      background: linear-gradient(to bottom, #2d2d2d 0%, #1a1a1a 50%, #0d0d0d 51%, #000000 100%);
      border-top: 1px solid #333333;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .tw-nav-bar-2012 {
      background: linear-gradient(to bottom, #54779d 0%, #375477 50%, #2b4463 51%, #1f344f 100%);
      border-bottom: 1px solid #16263b;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.3);
      text-shadow: 0 -1px 0 rgba(0,0,0,0.8);
    }

    .pill-toggle-container {
      display: inline-flex;
      align-items: center;
      background: rgba(243, 237, 247, 0.85);
      border: 1px solid #e2d7ec;
      border-radius: 9999px;
      padding: 3px;
      gap: 2px;
    }
    .pill-toggle-btn {
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 9999px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: #39215e;
      border: none;
      background: transparent;
    }
    .pill-toggle-btn.active {
      background: #e4a5bf;
      color: #2e1742;
      box-shadow: 0 2px 8px rgba(228, 165, 191, 0.45);
    }

    /* iOS 6 Phone Call UI */
    .glossy-btn-red {
      background: linear-gradient(to bottom, #f37d80 0%, #e02f35 50%, #cc171e 51%, #a10d13 100%);
      border: 1px solid #7a0c10;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 2px 5px rgba(0,0,0,0.5);
      color: white; 
      text-shadow: 0 -1px 0 rgba(0,0,0,0.6);
      border-radius: 8px; 
      font-weight: bold;
    }
    .glossy-btn-green {
      background: linear-gradient(to bottom, #98ec66 0%, #54c518 50%, #43b20b 51%, #2f9204 100%);
      border: 1px solid #216d03;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 2px 5px rgba(0,0,0,0.5);
      color: white; 
      text-shadow: 0 -1px 0 rgba(0,0,0,0.6);
      border-radius: 8px; 
      font-weight: bold;
    }
    .call-grid-bg {
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.3);
    }
    .call-grid-cell {
      border-right: 1px solid rgba(255,255,255,0.15);
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    /* Add-on navigation and utility dialogs. Existing mockup styling remains untouched. */
    .assistive-wrap{position:fixed;right:18px;bottom:22px;z-index:3000;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
    .assistive-button{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.95);background:linear-gradient(145deg,#b49bdc,#789fc8);box-shadow:0 5px 20px #39215e45;display:grid;place-items:center;color:#fff;font-size:22px}
    .assistive-button:focus-visible,.assistive-item:focus-visible{outline:3px solid #f7f78e;outline-offset:3px}
    .assistive-menu{display:flex;flex-direction:column;gap:7px;align-items:flex-end;padding:12px;background:#fffdf7ed;border:1px solid #d8cde8;border-radius:18px;box-shadow:0 12px 36px #39215e30;backdrop-filter:blur(12px);min-width:190px}
    .assistive-item{border:1px solid #e4d9f2;background:#fff;color:#39215e;border-radius:10px;padding:11px 14px;width:100%;font-size:11px;font-weight:800;letter-spacing:.1em;text-align:left}
    .assistive-item:hover{background:#f0e8fb}
    .utility-overlay{position:fixed;inset:0;z-index:2500;background:#1b1227a8;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
    .utility-dialog{width:min(620px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;background:#fffdf8;border:1px solid #d8cde8;border-radius:18px;box-shadow:0 20px 70px #1b122766;color:#39215e}
    .utility-head{position:sticky;top:0;background:#fffdf8;border-bottom:1px solid #e8dff5;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:1}
    .utility-head h2{font-family:Georgia,serif;font-size:20px;margin:0}
    .utility-close{border:0;background:#f0e8fb;border-radius:9px;width:34px;height:34px;font-size:22px;line-height:1}
    .utility-body{padding:18px;display:grid;gap:14px}
    .utility-body h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px}
    .utility-body p{font-size:12px;line-height:1.65;margin:0;color:#5c506d}
    .folder-input{width:100%;border:1px solid #d8cde8;border-radius:9px;padding:10px 12px;background:white;color:#39215e;font-size:13px}
    .folder-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid #e8dff5;background:#fff;padding:12px;border-radius:12px}
    .folder-row small{display:block;color:#756a84;font-size:10px;margin-top:4px}
    .folder-actions{display:flex;gap:6px;flex-wrap:wrap}
    .folder-action{border:1px solid #d8cde8;background:#f6f0ff;color:#39215e;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:800}
    .folder-action.primary{background:#39215e;color:#fff;border-color:#39215e}
    .folder-empty{font-size:12px;color:#756a84;padding:12px;border:1px dashed #d8cde8;border-radius:10px}
    @media(max-width:480px){.assistive-wrap{right:12px;bottom:14px}.assistive-button{width:52px;height:52px}.utility-overlay{padding:10px}.utility-dialog{max-height:calc(100dvh - 20px)}}
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const DEFAULT_AVATAR_MAYARI = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23c084fc'/><circle cx='50' cy='38' r='18' fill='%23ffffff'/><path d='M20,82 C20,62 33,52 50,52 C67,52 80,62 80,82 Z' fill='%23ffffff'/></svg>";
    const DEFAULT_AVATAR_USER1 = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23a855f7'/><circle cx='50' cy='38' r='18' fill='%23ffffff'/><path d='M20,82 C20,62 33,52 50,52 C67,52 80,62 80,82 Z' fill='%23ffffff'/></svg>";

        setVaultForm({ id: '', contactName: '', contactAvatar: DEFAULT_AVATAR_MAYARI, samePicAll: true, fbName: '', fbAvatar: DEFAULT_AVATAR_MAYARI, fbCover: DEFAULT_COVER_PLACEHOLDER, fbPrivate: false, fbVerified: false, igUsername: '', igDisplayName: '', igAvatar: DEFAULT_AVATAR_MAYARI, igPrivate: false, igVerified: false, syncIgTw: true, twUsername: '', twDisplayName: '', twAvatar: DEFAULT_AVATAR_MAYARI, twPrivate: false, twVerified: false });
      };

      const resetAllVaultDefaults = () => { setCharacters(DEFAULT_CHARACTERS); localStorage.setItem("iosix_vault_characters", JSON.stringify(DEFAULT_CHARACTERS)); showToast("Vault reset to default profiles!"); };
      const editVaultCharacter = (char) => { setVaultForm(char); };
      const deleteVaultCharacter = (id) => { setCharacters(characters.filter(c => c.id !== id)); showToast("Profile deleted from Vault."); };

      const autofillMockupsWithCharacter = (char) => {
        setImessage(prev => ({ ...prev, messagingWithId: char.id, contactName: char.contactName, contactAvatar: char.contactAvatar }));
        setInstagram(prev => ({ ...prev, profileVaultId: char.id, viewerStatus: char.igPrivate ? 'Request' : 'Edit Profile' }));
        setTwitter(prev => ({ ...prev, profileVaultId: char.id, viewerStatus: char.twPrivate ? 'Request' : 'Edit Profile' }));
        setFacebook(prev => ({ ...prev, profileVaultId: char.id, authorVaultId: char.id, }));
        showToast(`Auto-filled all mockups with ${char.contactName}!`);
      };

      const captureScreenshot = async () => {
        const targetElement = (exportIncludeFrame && phoneColor !== 'none') ? phoneOuterRef.current : phoneScreenRef.current;
        if (!targetElement) return;
        setExporting(true);
        try {
          // Wait for the same preview's web fonts and image assets before capture to reduce missing glyphs/icons.
          if (document.fonts && document.fonts.ready) await document.fonts.ready.catch(() => {});
          const previewImages = Array.from(targetElement.querySelectorAll('img'));
          await Promise.all(previewImages.map(img => {
            if (img.complete && img.naturalWidth > 0) return img.decode ? img.decode().catch(() => {}) : Promise.resolve();
            return new Promise(resolve => {
              const finish = () => resolve();
              img.addEventListener('load', finish, { once: true });
              img.addEventListener('error', finish, { once: true });
              setTimeout(finish, 6000);
            });
          }));
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          const canvas = await html2canvas(targetElement, { scale: exportResolution, useCORS: true, allowTaint: true, backgroundColor: transparentExport ? null : '#ffffff', logging: false, imageTimeout: 6000, removeContainer: true });
          const dataUrl = canvas.toDataURL("image/png");
          setRenderedExportUrl(dataUrl);
        } catch (err) { console.error("Capture error", err); showToast("Export error. Try again!"); } finally { setExporting(false); }
      };

      const scrollToWorkspace = (toolId) => { if (toolId) setActiveTab(toolId); const el = document.getElementById("workspace"); if (el) el.scrollIntoView({ behavior: 'smooth' }); };
      const takeWorldSnapshot = () => ({
        activeTab, phoneDarkMode, phoneColor, cornerRadius, canvasShadow, isTikTokCanvas, statusBar,
        characters, overlayNotif, imessage, phoneCall, instagram, twitter, facebook, notes, lockscreen
      });
      if (!initialWorldState.current) initialWorldState.current = takeWorldSnapshot();
      useEffect(() => { try { localStorage.setItem('iosix_world_folders', JSON.stringify(folders)); } catch(e) {} }, [folders]);
      useEffect(() => { try { if (activeFolderId) localStorage.setItem('iosix_active_world_folder', activeFolderId); else localStorage.removeItem('iosix_active_world_folder'); } catch(e) {} }, [activeFolderId]);
      const applyWorldSnapshot = (d) => {
        if (!d) return;
        if (d.activeTab) setActiveTab(d.activeTab); if (typeof d.phoneDarkMode === 'boolean') setPhoneDarkMode(d.phoneDarkMode);
        if (d.phoneColor) setPhoneColor(d.phoneColor); if (d.cornerRadius !== undefined) setCornerRadius(d.cornerRadius);
        if (d.canvasShadow !== undefined) setCanvasShadow(d.canvasShadow); if (d.isTikTokCanvas !== undefined) setIsTikTokCanvas(d.isTikTokCanvas);
        if (d.statusBar) setStatusBar(d.statusBar); if (d.characters) setCharacters(d.characters); if (d.overlayNotif) setOverlayNotif(d.overlayNotif);
        if (d.imessage) setImessage(d.imessage); if (d.phoneCall) setPhoneCall(d.phoneCall); if (d.instagram) setInstagram(d.instagram);
        if (d.twitter) setTwitter(d.twitter); if (d.facebook) setFacebook(d.facebook); if (d.notes) setNotes(d.notes); if (d.lockscreen) setLockscreen(d.lockscreen);
      };
      const createWorldFolder = () => {
        const name = (folderNameRef.current?.value || '').trim();
        if (!name) { showToast('Please enter a folder name first.'); folderNameRef.current?.focus(); return; }
        const fresh = JSON.parse(JSON.stringify(initialWorldState.current));
        const folder = { id: 'world-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), name, data: fresh, updatedAt: Date.now() };
        setFolders(prev => [folder, ...prev]); setActiveFolderId(folder.id); applyWorldSnapshot(fresh);
        if (folderNameRef.current) folderNameRef.current.value = '';
        showToast('New world folder created with the original default mockup settings.');
      };
      const saveWorldFolder = () => {
        if (!activeFolderId) { showToast('Create or open a folder before saving edits.'); return; }
        const snapshot = JSON.parse(JSON.stringify(takeWorldSnapshot()));
        setFolders(prev => prev.map(f => f.id === activeFolderId ? {...f, data: snapshot, updatedAt: Date.now()} : f));
        showToast('All mockup edits saved to this folder on this device.');
      };
      const openWorldFolder = (folder) => { applyWorldSnapshot(JSON.parse(JSON.stringify(folder.data))); setActiveFolderId(folder.id); setFoldersOpen(false); showToast('Opened folder: ' + folder.name); };
      const renameWorldFolder = (folder) => { const name = prompt('Rename this world folder:', folder.name); if (name === null) return; if (!name.trim()) { showToast('Folder name cannot be blank.'); return; } setFolders(prev => prev.map(f => f.id === folder.id ? {...f, name: name.trim(), updatedAt: Date.now()} : f)); };
      const deleteWorldFolder = (folder) => { if (!confirm('Delete “' + folder.name + '” and its saved edits?')) return; setFolders(prev => prev.filter(f => f.id !== folder.id)); if (activeFolderId === folder.id) setActiveFolderId(''); };
      const FloatingAssistiveMenu = () => (<div className="assistive-wrap"><button type="button" className="assistive-button" aria-label="Open navigation menu" aria-expanded={assistiveOpen} onClick={() => setAssistiveOpen(v => !v)}><i className="fa-solid fa-circle-nodes"></i></button>{assistiveOpen && <div className="assistive-menu"><button className="assistive-item" onClick={() => { setAssistiveOpen(false); setHasEntered(true); setTimeout(() => scrollToWorkspace(), 80); }}>STUDIO</button><button className="assistive-item" onClick={() => { setAssistiveOpen(false); setFoldersOpen(true); }}>SAVED PROJECTS</button><button className="assistive-item" onClick={() => { setAssistiveOpen(false); setGuidelinesOpen(true); }}>GUIDELINES</button><button className="assistive-item" onClick={() => { setAssistiveOpen(false); setFoldersOpen(false); setGuidelinesOpen(false); setHasEntered(false); }}>EXIT</button></div>}</div>);
      const UtilityDialogs = () => (<>
        {guidelinesOpen && <div className="utility-overlay" role="presentation" onClick={e => { if (e.target === e.currentTarget) setGuidelinesOpen(false); }}><section className="utility-dialog" role="dialog" aria-modal="true" aria-labelledby="guidelines-title"><div className="utility-head"><h2 id="guidelines-title">Usage Guidelines &amp; Disclaimers</h2><button className="utility-close" onClick={() => setGuidelinesOpen(false)} aria-label="Close guidelines">×</button></div><div className="utility-body"><div><h3>Privacy First</h3><p>All graphics generate strictly inside your web browser. No text, images, or exported mockups are ever uploaded, stored, or published on external servers.</p></div><div><h3>Creative Conduct</h3><p>Designed exclusively for fictional storytelling, fan fiction, and layout concepts. Please do not use these templates to impersonate real individuals or generate deceptive media.</p></div><div><h3>Independent Project</h3><p>Unofficial fan utility. Not affiliated with, endorsed by, or connected to Apple Inc., Meta Platforms (Facebook, Instagram), X (formerly Twitter), Discord, or TikTok.</p></div></div></section></div>}
        {foldersOpen && <div className="utility-overlay" role="presentation" onClick={e => { if (e.target === e.currentTarget) setFoldersOpen(false); }}><section className="utility-dialog" role="dialog" aria-modal="true" aria-labelledby="folders-title"><div className="utility-head"><h2 id="folders-title">Saved Projects</h2><button className="utility-close" onClick={() => setFoldersOpen(false)} aria-label="Close saved projects">×</button></div><div className="utility-body"><div><h3>FOLDERS — EACH IS A SEPARATE WORLD</h3><p>Each folder keeps its own saved edits for every mockup. Create one for each character or alternate universe, then save all edits to that folder.</p></div><input ref={folderNameRef} className="folder-input" placeholder="Folder name (e.g. Alex's AU)" maxLength="80"/><div className="folder-actions"><button className="folder-action primary" onClick={createWorldFolder}>＋ Add folder</button><button className="folder-action primary" onClick={saveWorldFolder}>Save all edits to this folder</button></div><p style={{fontSize:'11px',color:'#756a84'}}>Active folder: {folders.find(f => f.id === activeFolderId)?.name || 'None selected'}. Saved locally in this browser.</p><div className="grid gap-2">{folders.length ? folders.map(folder => <div className="folder-row" key={folder.id}><div><strong>{folder.name}</strong><small>{activeFolderId === folder.id ? 'Currently active · ' : ''}Last saved {new Date(folder.updatedAt).toLocaleString()}</small></div><div className="folder-actions"><button className="folder-action primary" onClick={() => openWorldFolder(folder)}>Open folder</button><button className="folder-action" onClick={() => renameWorldFolder(folder)}>Rename</button><button className="folder-action" onClick={() => deleteWorldFolder(folder)}>Delete</button></div></div>) : <div className="folder-empty">No folders yet. Add one to create a separate world.</div>}</div></div></section></div>}
      </>);

      if (!hasEntered) {
        return (
          <><div id="intro"><div className="intro-panel"><img src={BRAND_LOGO_SVG} className="w-[min(340px,100%)] h-auto object-contain mb-4" alt="iOSix Studio Logo" /><p className="text-[10px] tracking-[0.2em] uppercase mb-[22px] text-[#5c4776] font-extrabold">A CREATIVE TOOLKIT FOR ALTERNATE UNIVERSES STORIES</p><button onClick={() => setHasEntered(true)} className="enter-btn">ENTER IOSIX STUDIO <span aria-hidden="true">→</span></button></div></div><FloatingAssistiveMenu /><UtilityDialogs /></>
        );
      }

      const activeIgChar = characters.find(c => c.id === instagram.profileVaultId) || characters[0];
      const activeTwChar = characters.find(c => c.id === twitter.profileVaultId) || characters[0];
      const activeFbProfileChar = characters.find(c => c.id === facebook.profileVaultId) || characters[0];
      const activeFbAuthorChar = characters.find(c => c.id === facebook.authorVaultId) || characters[0];

      const isIgPrivateLocked = (instagram.viewerStatus === 'Request' || instagram.viewerStatus === 'Requested' || (activeIgChar.igPrivate && instagram.viewerStatus !== 'Following' && instagram.viewerStatus !== 'Edit Profile')) && instagram.viewerStatus !== 'Blocked';
      const isTwPrivateLocked = (twitter.viewerStatus === 'Request' || twitter.viewerStatus === 'Requested' || (activeTwChar.twPrivate && twitter.viewerStatus !== 'Following' && twitter.viewerStatus !== 'Edit Profile')) && twitter.viewerStatus !== 'Blocked';

      return (
        <div id="app">
          {toastMsg && ( <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-[#39215e] text-white px-5 py-3 rounded-xl shadow-2xl text-xs font-bold border border-purple-400/30 animate-bounce">{toastMsg}</div> )}
          <div className="top-strip">Made for fictional stories, alternate universes & visual storytelling</div>
          <header>
            <div className="header-inner" style={{justifyContent:'center',position:'relative'}}>
              <a href="#" className="brand" onClick={(e) => { e.preventDefault(); scrollToWorkspace(); }}><img src={BRAND_LOGO_SVG} style={{ width: '210px', height: 'auto' }} alt="iOSix Studio" /></a>
            </div>
          </header>
          <main>
            <section className="hero">
              <div className="max-w-2xl mx-auto z-10">
                <h1>Make it look like<br />another time.</h1>
                <p>iOSix Studio is a dedicated creative toolkit for alternate universe (AU) writers, fan creators, and visual storytellers. Easily design authentic 2012-era Apple interfaces to bring your narratives to life across multiple classic platforms.</p>
                <div className="mt-4 flex flex-wrap gap-3 justify-center"><button onClick={() => scrollToWorkspace()} className="primary-btn">Open Workspace Studio</button><button onClick={() => setVaultOpen(true)} className="secondary-btn">Open Profile Vault</button></div>
              </div>
            </section>
            <section id="workspace" className="workspace">
              <div className="workspace-top">
                <div><h2 className="capitalize font-serif text-xl">{activeTab} Studio</h2><p className="text-xs text-[#756a84]">Customize and design your AU story mockup.</p></div>
                <div className="flex flex-wrap items-center gap-2"><button onClick={() => setVaultOpen(true)} className="secondary-btn py-2 text-[10px]"><i className="fa-solid fa-address-book"></i> Profile Vault</button><button onClick={() => { setExportOpen(true); captureScreenshot(); }} className="primary-btn py-2 text-[10px]"><i className="fa-solid fa-camera"></i> Export PNG</button></div>
              </div>
              <div className="workspace-body">
                <aside className="controls space-y-4">
                  {/* MOCKUP SELECTOR GRID */}
                  <div className="bg-[#fcfaff] border border-[#e8dff5] rounded-2xl p-3.5 shadow-sm space-y-2.5">
                    <div className="flex items-center justify-between"><span className="text-[11px] font-extrabold tracking-widest text-[#a188ba] uppercase">MOCKUPS</span><i className="fa-solid fa-chevron-down text-xs text-[#a188ba]"></i></div>
                    <div className="grid grid-cols-3 gap-y-3 gap-x-2 pt-1">
                      {[
                        { id: 'twitter', label: 'X / Twitter', icon: APP_ICONS['Twitter'].icon },
                        { id: 'instagram', label: 'Instagram', icon: APP_ICONS['Instagram'].icon },
                        { id: 'imessage', label: 'Messages', icon: APP_ICONS['Messages'].icon },
                        { id: 'phonecall', label: 'Phone Call', icon: APP_ICONS['Phone'].icon },
                        { id: 'notes', label: 'Notes', icon: APP_ICONS['Notes'].icon },
                        { id: 'facebook', label: 'Facebook', icon: APP_ICONS['Facebook'].icon },
                        { id: 'lockscreen', label: 'Lock Screen', icon: LOCK_ICON_SVG },
                      ].map(tool => {
                        const isActive = activeTab === tool.id;
                        return (
                          <button key={tool.id} onClick={() => setActiveTab(tool.id)} className="group flex flex-col items-center gap-1.5 transition text-center">
                            <div className={`w-11 h-11 rounded-2xl flex items-center justify-center text-lg shadow-sm transition-all overflow-hidden ${isActive ? 'ring-4 ring-[#e3b0d5] ring-offset-2 shadow-lg scale-105' : 'hover:scale-105 opacity-90'}`}>
                              <img src={tool.icon} className="w-full h-full object-cover" alt={tool.label} />
                            </div>
                            <span className={`text-[10px] tracking-tight font-bold ${isActive ? 'text-[#39215e]' : 'text-[#756a84]'}`}>{tool.label}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* EXPORT & CANVAS CONTROLS */}
                  <div className="p-3 bg-[rgba(250,246,255,0.9)] border border-purple-200/80 rounded-2xl space-y-2.5 text-xs shadow-sm">
                    <span className="font-extrabold uppercase tracking-wider text-purple-900 block text-[10px] border-b border-purple-200 pb-1"><i className="fa-solid fa-crop-simple"></i> EXPORT & CANVAS</span>
                    <div className="p-2 bg-amber-50 border border-amber-200 rounded-lg text-[10px] text-amber-900 leading-tight"><strong>Safari notice:</strong> the exported image may occasionally appear black. If it does, try <b>Download PNG</b> again until it looks as expected.</div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] text-slate-500 font-bold block">Phone Frame Bezel</label>
                        <select value={phoneColor} onChange={e => setPhoneColor(e.target.value)} className="w-full bg-white border rounded p-1 font-semibold text-[11px]"><option value="black">Frame: Black</option><option value="white">Frame: White</option><option value="none">Frame: None</option></select>
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-500 font-bold block">Canvas Format</label>
                        <button onClick={() => setIsTikTokCanvas(!isTikTokCanvas)} className={`w-full py-1 text-[10px] font-bold rounded border ${isTikTokCanvas ? 'bg-purple-700 text-white' : 'bg-slate-100 text-slate-800'}`}>{isTikTokCanvas ? 'TikTok Canvas' : 'Standard Phone'}</button>
                      </div>
                    </div>
                    {isTikTokCanvas && ( <div className="text-[9px] text-purple-800 italic font-semibold">Exports at 1068px wide — height follows the content</div> )}
                    <div className="space-y-1.5 pt-1 border-t border-purple-100">
                      <div className="flex items-center justify-between text-[10px] font-bold text-slate-600"><span>Resolution Scale:</span><div className="flex gap-1">{[1, 2, 3, 4].map(res => ( <button key={res} onClick={() => setExportResolution(res)} className={`px-2 py-0.5 rounded text-[9px] ${exportResolution === res ? 'bg-purple-700 text-white' : 'bg-slate-200 text-slate-800'}`}>{res}×</button> ))}</div></div>
                      <div className="flex items-center justify-between"><span className="text-[10px] font-bold text-slate-600">Corner Radius: {cornerRadius}px</span><input type="range" min="0" max="48" value={cornerRadius} onChange={e => setCornerRadius(Number(e.target.value))} className="w-24 accent-purple-700" /></div>
                      <div className="grid grid-cols-2 gap-2 text-[10px] font-bold"><label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={canvasShadow} onChange={e => setCanvasShadow(e.target.checked)} className="accent-purple-700" />Shadow</label><label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={transparentExport} onChange={e => setTransparentExport(e.target.checked)} className="accent-purple-700" />Transparent PNG</label></div>
                      <button onClick={() => { setExportOpen(true); captureScreenshot(); }} className="primary-btn w-full py-2 text-[10px] mt-1"><i className="fa-solid fa-download"></i> Download PNG</button>
                    </div>
                  </div>

                  {/* APPEARANCE CUSTOMIZATION */}
                  <div className="p-3 bg-[rgba(250,246,255,0.9)] border border-purple-200/80 rounded-2xl space-y-2.5 text-xs shadow-sm">
                    <span className="font-extrabold uppercase tracking-wider text-purple-900 block text-[10px] border-b border-purple-200 pb-1"><i className="fa-solid fa-sliders"></i> APPEARANCE CUSTOMIZATION</span>
                    <div className="grid grid-cols-2 gap-x-2 gap-y-1.5 text-[11px]">
                      <label className="flex items-center gap-1.5 font-bold cursor-pointer text-purple-950"><input type="checkbox" checked={phoneDarkMode} onChange={e => setPhoneDarkMode(e.target.checked)} className="accent-purple-700 w-3.5 h-3.5" />Dark Mode</label>
                      <label className="flex items-center gap-1.5 font-bold cursor-pointer text-purple-950"><input type="checkbox" checked={statusBar.showStatusBar} onChange={e => setStatusBar({...statusBar, showStatusBar: e.target.checked})} className="accent-purple-700 w-3.5 h-3.5" />Status Bar</label>
                      <label className="flex items-center gap-1.5 font-bold cursor-pointer text-purple-950 col-span-2"><input type="checkbox" checked={statusBar.showHomeIndicator} onChange={e => setStatusBar({...statusBar, showHomeIndicator: e.target.checked})} className="accent-purple-700 w-3.5 h-3.5" />Home Indicator</label>
                    </div>
                    <div className="grid grid-cols-3 gap-1.5 pt-1 border-t border-purple-100">
                      <div><label className="text-[9px] text-slate-500 font-bold block">Status Time</label><input type="text" value={statusBar.time} onChange={e => setStatusBar({...statusBar, time: e.target.value})} className="w-full bg-white border rounded p-1 text-[10px] font-bold" /></div>
                      <div><label className="text-[9px] text-slate-500 font-bold block">Carrier</label><input type="text" value={statusBar.carrier} onChange={e => setStatusBar({...statusBar, carrier: e.target.value})} className="w-full bg-white border rounded p-1 text-[10px] font-bold" /></div>
                      <div><label className="text-[9px] text-slate-500 font-bold block">Battery %</label><input type="number" min="0" max="100" value={statusBar.battery} onChange={e => setStatusBar({...statusBar, battery: Number(e.target.value)})} className="w-full bg-white border rounded p-1 text-[10px] font-bold" /></div>
                    </div>
                  </div>

                  {/* NOTIFICATION OVERLAY */}
                  <div className="p-3 bg-[rgba(250,246,255,0.9)] border border-purple-200/80 rounded-2xl space-y-2.5 text-xs shadow-sm">
                    <div className="flex items-center justify-between border-b border-purple-200 pb-1">
                      <span className="font-extrabold uppercase tracking-wider text-purple-900 block text-[10px]"><i className="fa-regular fa-bell"></i> NOTIFICATION OVERLAY</span>
                      <label className="flex items-center gap-1 cursor-pointer text-[10px] font-bold text-purple-900"><input type="checkbox" checked={overlayNotif.showOverlayNotification} onChange={e => setOverlayNotif({...overlayNotif, showOverlayNotification: e.target.checked})} className="accent-purple-700" />Show Overlay</label>
                    </div>
                    {overlayNotif.showOverlayNotification && (
                      <div className="space-y-2">
                        <div className="flex justify-between items-center"><span className="text-[10px] font-bold text-slate-600">Active Cards ({overlayNotif.notifications.length}):</span><button onClick={() => { const newN = { id: Date.now(), app: 'Messages', vaultCharId: characters[0].id, fromName: characters[0].contactName, avatar: characters[0].contactAvatar, time: 'now', message: 'New message preview...', isCall: false }; setOverlayNotif({...overlayNotif, notifications: [...overlayNotif.notifications, newN]}); }} className="text-purple-700 font-extrabold text-[10px]">+ Add Notification Card</button></div>
                        {overlayNotif.notifications.map((n, nIdx) => (
                          <div key={n.id} className="p-2.5 bg-white border rounded-xl space-y-1.5 shadow-sm">
                            <div className="flex justify-between items-center">
                              <select value={n.app} onChange={e => handleNotifAppChange(nIdx, e.target.value)} className="bg-purple-50 border rounded p-1 font-bold text-[10px] text-purple-900">
                                <option value="Messages">Messages</option><option value="Instagram">Instagram</option><option value="Twitter">Twitter / X</option><option value="Facebook">Facebook</option><option value="Phone Call">Phone Call (Incoming)</option>
                              </select>
                              <button onClick={() => setOverlayNotif({...overlayNotif, notifications: overlayNotif.notifications.filter(item => item.id !== n.id)})} className="text-rose-600 font-bold text-[10px]">Delete</button>
                            </div>
                            <div className="grid grid-cols-2 gap-1.5">
                              <div><label className="text-[8px] text-slate-400 font-bold block">From (Vault Profile)</label><select value={n.vaultCharId || ''} onChange={e => { const charId = e.target.value; const char = characters.find(c => c.id === charId); const up = [...overlayNotif.notifications]; if (char) { up[nIdx].vaultCharId = charId; up[nIdx].fromName = getNameForAppAndChar(char, up[nIdx].app); up[nIdx].avatar = getAvatarForAppAndChar(char, up[nIdx].app); } setOverlayNotif({...overlayNotif, notifications: up}); }} className="w-full bg-slate-50 border rounded p-1 font-bold text-[10px]">{characters.map(c => ( <option key={c.id} value={c.id}>{c.contactName}</option> ))}</select></div>
                              <div><label className="text-[8px] text-slate-400 font-bold block">Time Customize</label><input type="text" value={n.time} onChange={e => { const up = [...overlayNotif.notifications]; up[nIdx].time = e.target.value; setOverlayNotif({...overlayNotif, notifications: up}); }} className="bg-slate-50 border rounded p-1 text-[10px]" placeholder="e.g. now, 1m ago" /></div>
                            </div>
                            {!n.isCall && ( <div><label className="text-[8px] text-slate-400 font-bold block">Message Text</label><input type="text" value={n.message} onChange={e => { const up = [...overlayNotif.notifications]; up[nIdx].message = e.target.value; setOverlayNotif({...overlayNotif, notifications: up}); }} placeholder="Notification text preview..." className="w-full bg-slate-50 border rounded p-1 text-[10px]" /></div> )}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* INSTAGRAM CUSTOMIZER */}
                  {activeTab === 'instagram' && (

                  <div className="flex items-center gap-2 py-1"><input type="checkbox" id="samePicAll" checked={vaultForm.samePicAll} onChange={e => setVaultForm({...vaultForm, samePicAll: e.target.checked})} className="accent-purple-700" /><label htmlFor="samePicAll" className="font-semibold text-slate-700 cursor-pointer">Profile picture is same to all social meds and contact</label></div>
                  <div className="grid grid-cols-2 gap-2"><div><label className="text-[9px] font-bold text-slate-500 block">Contact Picture</label><button type="button" onClick={() => triggerCropperModal(url => setVaultForm({...vaultForm, contactAvatar: url}), '1:1')} className="text-[10px] text-purple-700 underline font-bold">Crop & Upload</button></div><div><label className="text-[9px] font-bold text-slate-500 block">Facebook Cover Photo</label><button type="button" onClick={() => triggerCropperModal(url => setVaultForm({...vaultForm, fbCover: url}), 'banner')} className="text-[10px] text-purple-700 underline font-bold">Crop & Upload (Banner)</button></div></div>
                  {!vaultForm.samePicAll && ( <div className="grid grid-cols-3 gap-2 pt-1 border-t"><div><label className="text-[9px] font-bold text-slate-500 block">Facebook Pic</label><button type="button" onClick={() => triggerCropperModal(url => setVaultForm({...vaultForm, fbAvatar: url}), '1:1')} className="text-[9px] text-purple-700 underline font-bold">Crop</button></div><div><label className="text-[9px] font-bold text-slate-500 block">IG Pic</label><button type="button" onClick={() => triggerCropperModal(url => setVaultForm({...vaultForm, igAvatar: url}), '1:1')} className="text-[9px] text-purple-700 underline font-bold">Crop</button></div><div><label className="text-[9px] font-bold text-slate-500 block">Twitter Pic</label><button type="button" onClick={() => triggerCropperModal(url => setVaultForm({...vaultForm, twAvatar: url}), '1:1')} className="text-[9px] text-purple-700 underline font-bold">Crop</button></div></div> )}
                  <div className="grid grid-cols-2 gap-3 pt-2 border-t">
                    <div>
                      <label className="text-[10px] font-bold text-slate-500 block">IG Username & Display Name</label>
                      <div className="grid grid-cols-2 gap-1 mb-1"><input type="text" value={vaultForm.igUsername} onChange={e => setVaultForm({...vaultForm, igUsername: e.target.value})} placeholder="mayari" className="bg-white border rounded p-1 text-[11px]" /><input type="text" value={vaultForm.igDisplayName} onChange={e => setVaultForm({...vaultForm, igDisplayName: e.target.value})} placeholder="Mayari™" className="bg-white border rounded p-1 text-[11px]" /></div>
                      <div className="flex items-center gap-3 text-[10px]"><label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={vaultForm.igPrivate} onChange={e => setVaultForm({...vaultForm, igPrivate: e.target.checked})} /> Private Account</label><label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={vaultForm.igVerified} onChange={e => setVaultForm({...vaultForm, igVerified: e.target.checked})} /> Verified</label></div>
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-500 block">Twitter Username & Display Name</label>
                      <div className="grid grid-cols-2 gap-1 mb-1"><input type="text" value={vaultForm.twUsername} onChange={e => setVaultForm({...vaultForm, twUsername: e.target.value})} placeholder="mayari" className="bg-white border rounded p-1 text-[11px]" disabled={vaultForm.syncIgTw} /><input type="text" value={vaultForm.twDisplayName} onChange={e => setVaultForm({...vaultForm, twDisplayName: e.target.value})} placeholder="Mayari" className="bg-white border rounded p-1 text-[11px]" disabled={vaultForm.syncIgTw} /></div>
                      <div className="flex items-center gap-3 text-[10px]"><label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={vaultForm.twPrivate} onChange={e => setVaultForm({...vaultForm, twPrivate: e.target.checked})} /> Private</label><label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={vaultForm.twVerified} onChange={e => setVaultForm({...vaultForm, twVerified: e.target.checked})} /> Verified</label></div>
                    </div>
                  </div>
                  <div className="flex items-center gap-2"><input type="checkbox" id="syncIgTw" checked={vaultForm.syncIgTw} onChange={e => setVaultForm({...vaultForm, syncIgTw: e.target.checked})} className="accent-purple-700" /><label htmlFor="syncIgTw" className="font-semibold text-slate-700 cursor-pointer">Same IG & Twitter username and display (autofills Twitter)</label></div>
                  <div className="flex items-center gap-4 bg-white p-2 rounded-lg border"><span className="font-bold text-[10px] text-blue-800">Facebook Flags:</span><label className="flex items-center gap-1 cursor-pointer font-medium"><input type="checkbox" checked={vaultForm.fbPrivate} onChange={e => setVaultForm({...vaultForm, fbPrivate: e.target.checked})} /> Private</label><label className="flex items-center gap-1 cursor-pointer font-medium"><input type="checkbox" checked={vaultForm.fbVerified} onChange={e => setVaultForm({...vaultForm, fbVerified: e.target.checked})} /> Verified</label></div>
                  <div className="flex gap-2"><button type="submit" className="primary-btn flex-1 py-2.5 text-xs">{vaultForm.id ? 'Save Changes' : 'Save Profile to Vault'}</button>{vaultForm.id && <button type="button" onClick={resetVaultForm} className="secondary-btn py-2.5 text-xs">Cancel</button>}</div>
                </form>
                <div className="space-y-2">
                  <span className="font-bold text-purple-900 block uppercase tracking-wider text-[10px]">Saved Profiles ({characters.length}):</span>
                  {characters.map(char => (
                    <div key={char.id} className="p-3 bg-white border rounded-xl flex items-center gap-3">
                      <img src={char.contactAvatar} className="w-10 h-10 rounded-full border object-cover" />
                      <div className="flex-1 min-w-0"><strong className="font-serif text-sm block flex items-center gap-1"><span>{char.contactName}</span>{char.igPrivate && <i className="fa-solid fa-lock text-[10px] text-amber-600"></i>}</strong><span className="text-[10px] text-slate-400 truncate block">@{char.igUsername || 'username'}</span></div>
                      <div className="flex items-center gap-1.5"><button onClick={() => editVaultCharacter(char)} className="px-2.5 py-1 text-[10px] font-bold bg-slate-100 border rounded">Edit</button><button onClick={() => deleteVaultCharacter(char.id)} className="px-2.5 py-1 text-[10px] font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded">Delete</button><button onClick={() => autofillMockupsWithCharacter(char)} className="primary-btn py-1 px-2.5 text-[9px] bg-purple-700"><i className="fa-solid fa-wand-magic-sparkles"></i> Use for Mockups</button></div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          <FloatingAssistiveMenu />
          <UtilityDialogs />

          {/* EXPORT MODAL */}
          {exportOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#fffdf9] border border-purple-200 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl text-slate-800">
                <div className="flex justify-between items-center border-b pb-3"><h2 className="font-serif text-xl font-bold text-purple-950">Export Mockup Photo</h2><button onClick={() => setExportOpen(false)} className="text-xl font-bold text-slate-400">×</button></div>
                <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-[11px] text-amber-900 space-y-1"><strong className="font-bold flex items-center gap-1"><i className="fa-solid fa-triangle-exclamation"></i> Safari notice:</strong><p>The exported image may occasionally appear black. If it does, try clicking <strong>Download PNG</strong> again until it looks as expected.</p></div>
                <div className="space-y-3 text-xs">
                  <div className="flex justify-between items-center"><span className="font-semibold">Include Phone Frame Bezel</span><input type="checkbox" checked={exportIncludeFrame} onChange={e => setExportIncludeFrame(e.target.checked)} className="w-4 h-4 accent-purple-600" /></div>
                  <div className="flex justify-between items-center"><span className="font-semibold">Transparent PNG</span><input type="checkbox" checked={transparentExport} onChange={e => setTransparentExport(e.target.checked)} className="w-4 h-4 accent-purple-600" /></div>
                  <div className="flex justify-between items-center"><span className="font-semibold">Resolution Scale</span><div className="flex gap-1">{[1, 2, 3, 4].map(res => <button key={res} onClick={() => setExportResolution(res)} className={`px-2.5 py-1 rounded font-bold text-[10px] ${exportResolution === res ? 'bg-purple-700 text-white' : 'bg-slate-200 text-slate-800'}`}>{res}×</button>)}</div></div>
                  <button onClick={captureScreenshot} className="secondary-btn w-full py-1.5 text-[10px]">Refresh Render</button>
                </div>
                <div className="bg-black/10 rounded-xl p-2 text-center min-h-[160px] flex items-center justify-center border">{exporting ? ( <div className="space-y-2 text-purple-900"><i className="fa-solid fa-spinner fa-spin text-2xl"></i><p className="text-xs font-bold">Rendering PNG image...</p></div> ) : renderedExportUrl ? ( <img src={renderedExportUrl} className="max-h-48 mx-auto rounded shadow-lg object-contain" /> ) : ( <p className="text-slate-400 text-xs">Click Refresh Render to generate</p> )}</div>
                <a href={renderedExportUrl || '#'} download={`iosix-${activeTab}-${Date.now()}.png`} className={`w-full py-2.5 rounded-xl font-bold text-xs text-center transition flex items-center justify-center gap-2 ${renderedExportUrl ? 'bg-emerald-600 text-white shadow-md hover:bg-emerald-700' : 'bg-slate-300 text-white pointer-events-none'}`}><i className="fa-solid fa-download"></i> Download PNG</a>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
