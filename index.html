    :root {
      --lav: #c6b4e5;
      --lilac: #b49bdc;
      --yellow: #f7f78e;
      --ivory: #fffed1;
      --sky: #a8cfe2;
      --blue: #789fc8;
      --ink: #39215e;
      --paper: #fffdf7;
      --line: #d8cde8;
      --muted: #756a84;
      --shadow: 0 14px 40px #4a2c6714;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #fbf9ff;
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background:
        radial-gradient(ellipse at 18% 18%, #fff9f4 0%, transparent 34%),
        radial-gradient(ellipse at 82% 24%, #d9efff 0%, transparent 34%),
        radial-gradient(ellipse at 78% 82%, #fff7a8 0%, transparent 32%),
        radial-gradient(ellipse at 20% 84%, #e3d4ff 0%, transparent 38%),
        linear-gradient(135deg, #cbb8ec 0%, #bca6e4 24%, #fff5a0 49%, #fffbd8 64%, #b8dced 82%, #8eb4dc 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      transition: opacity .55s ease, visibility .55s ease;
    }

    .intro-panel {
      width: min(520px, 100%);
      background: rgba(255, 253, 249, 0.94);
      border: 1px solid #ffffffa8;
      box-shadow: 0 18px 60px #39215e20;
      backdrop-filter: blur(12px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      text-align: center;
    }

    .enter-btn, .primary-btn {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
      padding: 12px 24px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      transition: transform .2s, background .2s, box-shadow .2s;
    }
    .enter-btn:hover, .primary-btn:hover {
      background: #54377a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(57,33,94,0.25);
    }

    .top-strip {
      background: var(--ink);
      color: #fff8dc;
      padding: 8px 14px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 700;
    }

    header {
      background: #fffdf8;
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 5;
    }

    .header-inner {
      max-width: 1280px;
      margin: auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .nav-btn:hover { background: #f0e8fb; }

    main {
      max-width: 1280px;
      margin: auto;
      padding: 0 24px 70px;
    }

    .hero {
      margin: 24px 0;
      background: var(--ivory);
      min-height: 180px;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #ece7b7;
      border-radius: 16px;
    }
    .hero:before, .hero:after {
      content: "✿";
      position: absolute;
      font-size: 42px;
      color: #f1a7bd;
      opacity: .9;
    }
    .hero:before { left: 5%; top: 12%; }
    .hero:after { right: 5%; bottom: 12%; color: #9fc5e4; }

    .hero h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(24px, 3.5vw, 40px);
      font-weight: 400;
      line-height: 1.1;
      margin: 8px 0;
      color: var(--ink);
    }

    .hero p {
      max-width: 640px;
      margin: 0 auto;
      color: #675b73;
      font-family: Georgia, serif;
      font-size: 13px;
      line-height: 1.5;
    }

    .secondary-btn {
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      padding: 10px 18px;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 8px;
      transition: background .2s, transform .2s;
    }
    .secondary-btn:hover { background: #f0e8fb; transform: translateY(-1px); }

    .workspace {
      margin-top: 24px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
      border-radius: 16px;
      overflow: hidden;
    }

    .workspace-top {
      padding: 16px 24px;
      background: #f4eefc;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .workspace-body {
      display: grid;
      grid-template-columns: minmax(360px, 480px) minmax(0, 1fr);
      min-height: 650px;
    }
    @media (max-width: 980px) { .workspace-body { grid-template-columns: 1fr; } }

    .controls {
      padding: 24px;
      border-right: 1px solid var(--line);
      background: #fffdf9;
      max-height: 820px;
      overflow-y: auto;
    }

    .preview-area {
      background: #f4f1f8;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      min-width: 0;
      overflow-x: auto;
    }

    .bg-ios-grid-light {
      background-color: #dbdfe7;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
      background-size: 8px 8px;
    }

    .ios6-nav-bar {
      background: linear-gradient(to bottom, #b0c4de 0%, #6d8ba6 50%, #51708f 51%, #315171 100%);
      border-bottom: 1px solid #1f364d;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.3);
      text-shadow: 0 -1px 0 rgba(0,0,0,0.7);
    }

    .ios6-nav-button {
      background: linear-gradient(to bottom, #7a98b3 0%, #466785 50%, #305170 51%, #223f5b 100%);
      border: 1px solid #1d334a;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 1px 2px rgba(0,0,0,0.3);

      text-shadow: 0 -1px 0 rgba(0,0,0,0.8);

      border: 1px solid #b5b5b5;
      border-radius: 4px;

      color: #333333;

      border: 1px solid #0f4094;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 1px 2px rgba(0,0,0,0.2);
      color: white;
      font-weight: 700;
      text-shadow: 0 -1px 0 rgba(0,0,0,0.5);
    }

    /* 2012 Glossy Grey Requested/Following Button */
    .ig-btn-2012-grey {
      background: linear-gradient(to bottom, #e0e0e0 0%, #cccccc 50%, #b8b8b8 51%, #a8a8a8 100%);
      border: 1px solid #777777;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 1px 2px rgba(0,0,0,0.15);
      color: #222222;
      font-weight: 700;
      text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    }

    /* 2012 Glossy Tab Subbar */
    .ig-subbar-2012 {
      background: linear-gradient(to bottom, #f9f9f9 0%, #e6e6e6 100%);
      border-bottom: 1px solid #c8c8c8;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    /* Speech bubble arrow pointer for active IG grid tab */
    .ig-tab-arrow-down {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #e6e6e6;
    }

    /* 2012 Glossy Bottom Navigation Bar */
    .ig-bottom-bar-2012 {
      background: linear-gradient(to bottom, #2d2d2d 0%, #1a1a1a 50%, #0d0d0d 51%, #000000 100%);
      border-top: 1px solid #333333;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .imessage-bubble-blue {
      background: linear-gradient(to bottom, #5da2fa 0%, #1260e6 100%);
      border: 1px solid #0f52cc;
      color: white;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 1px 2px rgba(0,0,0,0.25);
      border-radius: 18px;
      position: relative;

      background: linear-gradient(to bottom, #94ed5a 0%, #30bd0a 100%);
      border: 1px solid #239403;
      color: #0d3801;
      font-weight: 500;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 1px 2px rgba(0,0,0,0.25);
      border-radius: 18px;
      position: relative;
    }

    .imessage-bubble-grey {
      background: linear-gradient(to bottom, #ffffff 0%, #e2e4e8 100%);
      border: 1px solid #b3b6ba;
      color: #111;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 1px 2px rgba(0,0,0,0.18);
      border-radius: 18px;
      position: relative;
    }

    @keyframes shimmer {
      0% { background-position: -150px 0; }
      100% { background-position: 150px 0; }
    }

    .slide-to-unlock-text {
      background: linear-gradient(90deg, #4d4d4d 0%, #4d4d4d 20%, #ffffff 50%, #4d4d4d 80%, #4d4d4d 100%);
      background-size: 200px 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2.5s infinite linear;
    }

    /* Pill Toggle Switcher */
    .pill-toggle-container {
      display: inline-flex;
      align-items: center;
      background: rgba(243, 237, 247, 0.85);
      border: 1px solid #e2d7ec;
      border-radius: 9999px;
      padding: 3px;
      gap: 2px;
    }
    .pill-toggle-btn {
      padding: 6px 22px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 9999px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: #39215e;
      border: none;
      background: transparent;
    }
    .pill-toggle-btn.active {
      background: #e4a5bf;
      color: #2e1742;
      box-shadow: 0 2px 8px rgba(228, 165, 191, 0.45);
    }
  </style>
</head>

                                      <div className="flex items-center gap-2">
                                        <span className="font-bold text-xs text-indigo-300">{char.contactName}</span>
                                        <span className="text-[9px] text-slate-400">{m.time}</span>
                                      </div>
                                      <p className="text-xs text-slate-200 mt-0.5">{m.text}</p>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}

                        {/* MESSENGER MOCKUP PREVIEW */}
                        {activeTab === 'messenger' && (
                          <div className={`flex-1 flex flex-col ${phoneDarkMode ? 'bg-black text-white' : 'bg-white text-slate-900'}`}>
                            <div className="h-12 px-3 border-b flex items-center justify-between">
                              <div className="flex items-center gap-2">
                                <img src={activeMsgChar.contactAvatar} className="w-8 h-8 rounded-full object-cover" />
                                <span className="font-bold text-xs">{activeMsgChar.contactName}</span>
                              </div>
                              <div className="flex items-center gap-3 text-sky-500 text-sm">
                                <i className="fa-solid fa-phone"></i>
                                <i className="fa-solid fa-video"></i>
                              </div>
                            </div>

                            <div className="flex-1 p-3 space-y-3 overflow-y-auto">
                              {messenger.messages.map(m => {
                                const isMe = m.senderId === 'me';
                                return (
                                  <div key={m.id} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[75%] px-3 py-2 rounded-2xl text-xs ${isMe ? 'bg-sky-500 text-white' : 'bg-slate-200 text-slate-900'}`}>
                                      {m.text}
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}

                        {/* FACEBOOK PREVIEW */}
                        {activeTab === 'facebook' && (
                          <div className={`flex-1 flex flex-col ${phoneDarkMode ? 'bg-slate-950 text-white' : 'bg-[#d8dfea] text-slate-900'}`}>
                            <div className="h-11 px-3 flex items-center justify-between text-white fb-nav-bar-2012 z-10">
                              <span className="font-bold text-base tracking-tight font-sans">facebook</span>
                            </div>

                            {facebook.subTab === 'profile' ? (
                              <div className="flex-1 overflow-y-auto">
                                <img src={facebook.coverPhoto || DEFAULT_COVER_PLACEHOLDER} className="w-full h-32 object-cover" />
                                <div className={`p-3 space-y-2 ${phoneDarkMode ? 'bg-slate-900 text-white' : 'bg-white text-slate-900'}`}>
                                  <div className="flex items-center gap-3">
                                    <img src={activeFbProfileChar.fbAvatar || activeFbProfileChar.contactAvatar} className="w-16 h-16 rounded border-2 border-white -mt-8 shadow" />
                                    <h2 className="font-bold text-base">{activeFbProfileChar.fbName || activeFbProfileChar.contactName}</h2>
                                  </div>
                                  <p className="text-xs text-slate-400">{facebook.bio}</p>
                                </div>
                              </div>
                            ) : (
                              <div className="p-2.5 space-y-2 flex-1 overflow-y-auto">
                                <div className={`p-3 border rounded space-y-2 ${phoneDarkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-300 text-slate-900'}`}>
                                  <div className="flex items-center gap-2">
                                    <img src={activeFbAuthorChar.fbAvatar || activeFbAuthorChar.contactAvatar} className="w-10 h-10 rounded object-cover" />
                                    <span className="font-bold text-xs">{activeFbAuthorChar.fbName || activeFbAuthorChar.contactName}</span>
                                  </div>
                                  <p className="text-xs">{facebook.postText}</p>
                                  {facebook.postImage && <img src={facebook.postImage} className="w-full rounded object-cover" />}
                                </div>
                              </div>
                            )}
                          </div>
                        )}

                        {/* TWITTER PREVIEW */}
                        {activeTab === 'twitter' && (
                          <div className={`flex-1 flex flex-col ${phoneDarkMode ? 'bg-black text-white' : 'bg-[#e1e8ed] text-slate-900'}`}>
                            <div className="h-11 px-3 flex items-center justify-between text-white tw-nav-bar-2012 z-10">
                              <span className="font-bold text-sm">X / Twitter</span>
                            </div>

                            <div className="p-3 space-y-2 flex-1 overflow-y-auto">
                              <div className={`p-3 rounded-lg border space-y-2 ${phoneDarkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-300 text-slate-900'}`}>
                                <div className="flex items-center gap-2.5">
                                  <img src={activeTwAuthorChar.twAvatar || activeTwAuthorChar.contactAvatar} className="w-10 h-10 rounded-full object-cover" />
                                  <div>
                                    <div className="font-bold text-xs">{activeTwAuthorChar.twDisplayName || activeTwAuthorChar.contactName}</div>
                                    <div className="text-[10px] text-slate-400">@{activeTwAuthorChar.twUsername}</div>
                                  </div>
                                </div>
                                <p className="text-xs leading-relaxed">{twitter.tweetText}</p>
                              </div>
                            </div>
                          </div>
                        )}

                        {/* LOCK SCREEN PREVIEW */}
                        {activeTab === 'lockscreen' && (
                          <div className="flex-1 flex flex-col justify-between relative overflow-hidden bg-cover bg-center" style={{ backgroundImage: `url(${lockscreen.wallpaper})` }}>
                            <div className="absolute inset-0 bg-black/30"></div>
                            <div className="relative z-10 pt-4 text-center">
                              <div className="bg-black/40 backdrop-blur-sm border border-white/20 rounded-2xl p-3 shadow-2xl inline-block w-full max-w-[280px]">
                                <div className="text-4xl font-extralight text-white tracking-tight">{lockscreen.time}</div>
                                <div className="text-xs text-slate-200 mt-1">{lockscreen.date}</div>
                              </div>
                            </div>
                            <div className="relative z-10 mb-4 px-3">
                              <div className="bg-black/60 border border-white/30 rounded-2xl p-2 flex items-center justify-between shadow-2xl">
                                <div className="w-10 h-8 bg-slate-200 rounded-xl flex items-center justify-center text-slate-700">
                                  <i className="fa-solid fa-chevron-right text-xs"></i>
                                </div>
                                <div className="flex-1 text-center font-medium text-xs slide-to-unlock-text pr-2">
                                  slide to unlock
                                </div>
                              </div>
                            </div>
                          </div>
                        )}

                        {statusBar.showHomeIndicator && (
                          <div className="py-1 flex justify-center bg-transparent z-20">
                            <div className={`w-32 h-1 rounded-full ${phoneDarkMode ? 'bg-slate-700' : 'bg-slate-400'}`}></div>
                          </div>
                        )}

                      </div>
                    </div>
                  </div>
                </div>

              </div>
            </section>
          </main>

          {/* VAULT MODAL */}
          {vaultOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#fffdf9] border border-purple-200 rounded-2xl max-w-2xl w-full p-6 space-y-4 shadow-2xl text-slate-800 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h2 className="font-serif text-xl font-bold text-purple-950">Character Profile Vault</h2>
                    <p className="text-xs text-slate-500">Manage character handles, avatars, verified status, and privacy.</p>
                  </div>
                  <button onClick={() => setVaultOpen(false)} className="text-xl font-bold text-slate-400 hover:text-purple-900">×</button>
                </div>

                <div className="flex justify-end">
                  <button onClick={resetAllVaultDefaults} className="text-xs font-bold text-rose-600 bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg hover:bg-rose-100 transition">
                    <i className="fa-solid fa-rotate-left"></i> Reset to Default Settings
                  </button>
                </div>

                <form onSubmit={handleSaveVaultCharacter} className="p-4 bg-purple-50/50 border border-purple-200 rounded-2xl space-y-3 text-xs">
                  <span className="font-bold text-purple-900 uppercase block">{vaultForm.id ? 'Edit Character Profile' : 'Add New Character'}</span>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[10px] font-bold text-slate-500 block">Contact Name *</label>
                      <input type="text" value={vaultForm.contactName} onChange={e => setVaultForm({...vaultForm, contactName: e.target.value})} placeholder="e.g. Mayari" className="w-full bg-white border rounded p-1.5 font-bold" required />
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-slate-500 block">Facebook Name</label>
                      <input type="text" value={vaultForm.fbName} onChange={e => setVaultForm({...vaultForm, fbName: e.target.value})} placeholder="Facebook Name" className="w-full bg-white border rounded p-1.5" />
                    </div>
                  </div>

                  <div className="flex items-center gap-2 py-1">
                    <input type="checkbox" id="samePicAll" checked={vaultForm.samePicAll} onChange={e => setVaultForm({...vaultForm, samePicAll: e.target.checked})} className="accent-purple-700" />
                    <label htmlFor="samePicAll" className="font-semibold text-slate-700 cursor-pointer">Profile picture is same to all social meds and contact</label>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[9px] font-bold text-slate-500 block">Contact Picture</label>
                      <input type="file" accept="image/*" onChange={e => handleImageUpload(e, url => setVaultForm({...vaultForm, contactAvatar: url}))} className="text-[8px] w-full" />
                    </div>
                    <div>
                      <label className="text-[9px] font-bold text-slate-500 block">Facebook Cover Photo</label>
                      <input type="file" accept="image/*" onChange={e => handleImageUpload(e, url => setVaultForm({...vaultForm, fbCover: url}))} className="text-[8px] w-full" />
                    </div>
                  </div>

                  {!vaultForm.samePicAll && (
                    <div className="grid grid-cols-3 gap-2 pt-1 border-t">
                      <div>
                        <label className="text-[9px] font-bold text-slate-500 block">Facebook Pic</label>
                        <input type="file" accept="image/*" onChange={e => handleImageUpload(e, url => setVaultForm({...vaultForm, fbAvatar: url}))} className="text-[8px] w-full" />
                      </div>
                      <div>
                        <label className="text-[9px] font-bold text-slate-500 block">IG Pic</label>
                        <input type="file" accept="image/*" onChange={e => handleImageUpload(e, url => setVaultForm({...vaultForm, igAvatar: url}))} className="text-[8px] w-full" />
                      </div>
                      <div>
                        <label className="text-[9px] font-bold text-slate-500 block">Twitter Pic</label>
                        <input type="file" accept="image/*" onChange={e => handleImageUpload(e, url => setVaultForm({...vaultForm, twAvatar: url}))} className="text-[8px] w-full" />
                      </div>
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-3 pt-2 border-t">
                    <div>
                      <label className="text-[10px] font-bold text-slate-500 block">IG Username & Display Name</label>
                      <div className="grid grid-cols-2 gap-1 mb-1">
                        <input type="text" value={vaultForm.igUsername} onChange={e => setVaultForm({...vaultForm, igUsername: e.target.value})} placeholder="_MAYARI" className="bg-white border rounded p-1 text-[11px]" />
                        <input type="text" value={vaultForm.igDisplayName} onChange={e => setVaultForm({...vaultForm, igDisplayName: e.target.value})} placeholder="Mayari™" className="bg-white border rounded p-1 text-[11px]" />
                      </div>
                      <div className="flex items-center gap-3 text-[10px]">
                        <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={vaultForm.igPrivate} onChange={e => setVaultForm({...vaultForm, igPrivate: e.target.checked})} /> Private Account</label>
                        <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={vaultForm.igVerified} onChange={e => setVaultForm({...vaultForm, igVerified: e.target.checked})} /> Verified</label>
                      </div>
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-slate-500 block">Twitter Username & Display Name</label>
                      <div className="grid grid-cols-2 gap-1 mb-1">
                        <input type="text" value={vaultForm.twUsername} onChange={e => setVaultForm({...vaultForm, twUsername: e.target.value})} placeholder="_Mayari" className="bg-white border rounded p-1 text-[11px]" disabled={vaultForm.syncIgTw} />
                        <input type="text" value={vaultForm.twDisplayName} onChange={e => setVaultForm({...vaultForm, twDisplayName: e.target.value})} placeholder="Mayari" className="bg-white border rounded p-1 text-[11px]" disabled={vaultForm.syncIgTw} />
                      </div>
                      <div className="flex items-center gap-3 text-[10px]">
                        <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={vaultForm.twPrivate} onChange={e => setVaultForm({...vaultForm, twPrivate: e.target.checked})} /> Private</label>
                        <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={vaultForm.twVerified} onChange={e => setVaultForm({...vaultForm, twVerified: e.target.checked})} /> Verified</label>
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <input type="checkbox" id="syncIgTw" checked={vaultForm.syncIgTw} onChange={e => setVaultForm({...vaultForm, syncIgTw: e.target.checked})} className="accent-purple-700" />
                    <label htmlFor="syncIgTw" className="font-semibold text-slate-700 cursor-pointer">Same IG & Twitter username and display (autofills Twitter)</label>
                  </div>

                  <div className="flex items-center gap-4 bg-white p-2 rounded-lg border">
                    <span className="font-bold text-[10px] text-blue-800">Facebook Flags:</span>
                    <label className="flex items-center gap-1 cursor-pointer font-medium"><input type="checkbox" checked={vaultForm.fbPrivate} onChange={e => setVaultForm({...vaultForm, fbPrivate: e.target.checked})} /> Private</label>
                    <label className="flex items-center gap-1 cursor-pointer font-medium"><input type="checkbox" checked={vaultForm.fbVerified} onChange={e => setVaultForm({...vaultForm, fbVerified: e.target.checked})} /> Verified</label>
                  </div>

                  <div className="flex gap-2">
                    <button type="submit" className="primary-btn flex-1 py-2.5 text-xs">{vaultForm.id ? 'Save Changes' : 'Save Profile to Vault'}</button>
                    {vaultForm.id && (
                      <button type="button" onClick={resetVaultForm} className="secondary-btn py-2.5 text-xs">Cancel</button>
                    )}
                  </div>
                </form>

                <div className="space-y-2">
                  <span className="font-bold text-purple-900 block uppercase tracking-wider text-[10px]">Saved Profiles ({characters.length}):</span>
                  {characters.map(char => (
                    <div key={char.id} className="p-3 bg-white border rounded-xl flex items-center gap-3">
                      <img src={char.contactAvatar} className="w-10 h-10 rounded-full border object-cover" />
                      <div className="flex-1 min-w-0">
                        <strong className="font-serif text-sm block flex items-center gap-1">
                          <span>{char.contactName}</span>
                          {char.igPrivate && <i className="fa-solid fa-lock text-[10px] text-amber-600"></i>}
                        </strong>
                        <span className="text-[10px] text-slate-400 truncate block">@{char.igUsername || 'username'}</span>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => editVaultCharacter(char)} className="px-2.5 py-1 text-[10px] font-bold bg-slate-100 border rounded">Edit</button>
                        <button onClick={() => deleteVaultCharacter(char.id)} className="px-2.5 py-1 text-[10px] font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded">Delete</button>
                        <button onClick={() => autofillMockupsWithCharacter(char)} className="primary-btn py-1 px-2.5 text-[9px] bg-purple-700">
                          <i className="fa-solid fa-wand-magic-sparkles"></i> Use for Mockups
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* EXPORT MODAL WITH SAFARI NOTICE */}
          {exportOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#fffdf9] border border-purple-200 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl text-slate-800">
                <div className="flex justify-between items-center border-b pb-3">
                  <h2 className="font-serif text-xl font-bold text-purple-950">Export Mockup Photo</h2>
                  <button onClick={() => setExportOpen(false)} className="text-xl font-bold text-slate-400">×</button>
                </div>

                <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-[11px] text-amber-900 space-y-1">
                  <strong className="font-bold flex items-center gap-1"><i className="fa-solid fa-triangle-exclamation"></i> Safari notice:</strong>
                  <p>The exported image may occasionally appear black. If it does, try clicking <strong>Download PNG</strong> again until it looks as expected.</p>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="flex justify-between items-center">
                    <span className="font-semibold">Include Phone Frame Bezel</span>
                    <input type="checkbox" checked={exportIncludeFrame} onChange={e => setExportIncludeFrame(e.target.checked)} className="w-4 h-4 accent-purple-600" />
                  </div>

                  <div className="flex justify-between items-center">
                    <span className="font-semibold">Transparent PNG</span>
                    <input type="checkbox" checked={transparentExport} onChange={e => setTransparentExport(e.target.checked)} className="w-4 h-4 accent-purple-600" />
                  </div>

                  <div className="flex justify-between items-center">
                    <span className="font-semibold">Resolution Scale</span>
                    <div className="flex gap-1">
                      {[1, 2, 3, 4].map(res => (
                        <button key={res} onClick={() => setExportResolution(res)} className={`px-2.5 py-1 rounded font-bold text-[10px] ${exportResolution === res ? 'bg-purple-700 text-white' : 'bg-slate-200 text-slate-800'}`}>{res}×</button>
                      ))}
                    </div>
                  </div>

                  <button onClick={captureScreenshot} className="secondary-btn w-full py-1.5 text-[10px]">Refresh Render</button>
                </div>

                <div className="bg-black/10 rounded-xl p-2 text-center min-h-[160px] flex items-center justify-center border">
                  {exporting ? (
                    <div className="space-y-2 text-purple-900">
                      <i className="fa-solid fa-spinner fa-spin text-2xl"></i>
                      <p className="text-xs font-bold">Rendering PNG image...</p>
                    </div>
                  ) : renderedExportUrl ? (
                    <img src={renderedExportUrl} className="max-h-48 mx-auto rounded shadow-lg object-contain" />
                  ) : (
                    <p className="text-slate-400 text-xs">Click Refresh Render to generate</p>
                  )}
                </div>

                <a
                  href={renderedExportUrl || '#'}
                  download={`iosix-${activeTab}-${Date.now()}.png`}
                  className={`w-full py-2.5 rounded-xl font-bold text-xs text-center transition flex items-center justify-center gap-2 ${
                    renderedExportUrl ? 'bg-emerald-600 text-white shadow-md hover:bg-emerald-700' : 'bg-slate-300 text-white pointer-events-none'
                  }`}
                >
                  <i className="fa-solid fa-download"></i>
                  Download PNG
                </a>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
